---
# Configure sandboxd operational hardening across the fleet.
#
# All non-secret ops env lives in ../../config/cluster.yml and AOCR secrets
# in ../../config/secrets.yml — the shared sources of truth Terraform also
# reads. Edit those files, then:
#
#   ansible-playbook playbooks/configure-ops.yml
#
# For fleet / Vault / SOPS workflows the wrap key + cluster PAT can also come
# from control-node files via the sandboxd_*_src vars in local.yml. If both a
# secrets.yml value AND a *_src path are set, the secrets.yml value wins.
#
# Backup cron is driven from inventory rather than the shared files:
#   ansible-playbook playbooks/configure-ops.yml -e sandboxd_backup_enabled=true

- name: Configure sandboxd observability and operations
  hosts: all
  become: true
  serial: 1
  any_errors_fatal: true
  gather_facts: false

  pre_tasks:
    - name: Gather hardware facts for architecture preflight
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - hardware

    - name: Assert homogeneous CPU architecture across play hosts
      run_once: true
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | map('extract', hostvars, 'ansible_architecture') | unique | length == 1
        fail_msg: >-
          Mixed CPU architectures detected across inventory hosts.
          AerolVM clusters must be single-arch (see plans/arm64-firecracker-hosts.md).

  # Shared SoT files Terraform also reads (Terraform/locals.tf: cluster_ops
  # and cluster_secrets). Paths are relative to this playbook file; both
  # tools point at the same on-disk files so day-0 and day-2 rollouts render
  # identical SB_* values into /etc/sandboxd/cluster.env. cluster.yml is
  # committed; secrets.yml is gitignored — bootstrap with
  #   cp config/secrets.example.yml config/secrets.yml
  vars_files:
    - "../../config/cluster.yml"
    - "../../config/secrets.yml"

  vars:
    sandboxd_ops_env:
      SB_OTEL_METRICS_ENABLED: "{{ ((otel.metrics_enabled | bool) or (otel.metrics_endpoint | length > 0)) | string | lower }}"
      SB_OTEL_METRICS_ENDPOINT: "{{ otel.metrics_endpoint }}"
      SB_OTEL_METRICS_INTERVAL: "{{ otel.metrics_interval }}"
      SB_OTEL_TRACES_ENABLED: "{{ ((otel.traces_enabled | bool) or (otel.traces_endpoint | length > 0)) | string | lower }}"
      SB_OTEL_TRACES_ENDPOINT: "{{ otel.traces_endpoint }}"
      SB_OTEL_TRACES_SAMPLE_RATIO: "{{ otel.traces_sample_ratio }}"
      OTEL_SERVICE_NAME: "{{ otel.service_name }}"
      SB_IMAGE_PULL_MAX_CONCURRENT: "{{ image_pull.max_concurrent }}"
      SB_IMAGE_PULL_FAILURE_BACKOFF: "{{ image_pull.failure_backoff }}"
      SB_IMAGE_GC_WHITELIST: "{{ image_gc.whitelist | join(',') }}"
      # Bool is lowercased so it matches the "true"/"false"
      # SB_IMAGE_BUILD_GC_ENABLED string config.go expects.
      SB_IMAGE_BUILD_GC_ENABLED: "{{ image_build_gc.enabled | bool | string | lower }}"
      SB_IMAGE_BUILD_GC_INTERVAL: "{{ image_build_gc.interval }}"
      SB_IMAGE_BUILD_GC_TTL: "{{ image_build_gc.ttl }}"
      SB_MIRROR_HOST: "{{ mirror.host }}"
      SB_MIRROR_PUSH_HOST: "{{ mirror.push_host }}"
      SB_MIRROR_UPSTREAMS: "{{ mirror.upstreams }}"
      SB_DOMAIN: "{{ ingress.domain_name }}"
      SB_ENABLE_CUSTOM_DOMAINS: "{{ ingress.enable_custom_domains | bool | string | lower }}"
      SB_CUSTOM_DOMAIN_VERIFY_PREFIX: "{{ ingress.custom_domain_txt_prefix }}"
      SB_CUSTOM_DOMAIN_VERIFY_VALUE_PREFIX: "{{ ingress.custom_domain_txt_value_prefix }}"
      SB_ENABLE_FIRECRACKER: "{{ firecracker.enabled | default(false) | bool | string | lower }}"
      SB_FIRECRACKER_BINARY: "{{ firecracker.binary_path | default('/usr/local/bin/firecracker') }}"
      SB_JAILER_BINARY: "{{ firecracker.jailer_path | default('/usr/local/bin/jailer') }}"
      SB_FIRECRACKER_KERNEL: "{{ firecracker.kernel_path | default('/var/lib/sandboxd/firecracker/vmlinux') }}"
      SB_FIRECRACKER_RUN_DIR: "{{ firecracker.run_dir | default('/run/sandboxd/firecracker') }}"
      SB_FIRECRACKER_TEMPLATES_DIR: "{{ firecracker.templates_dir | default('/var/lib/sandboxd/firecracker/templates') }}"
      SB_FIRECRACKER_USE_JAILER: "{{ firecracker.use_jailer | default(true) | bool | string | lower }}"
      SB_JAILER_CHROOT_BASE: "{{ firecracker.jailer_chroot_base | default('/srv/jailer') }}"
      SB_FIRECRACKER_TAP_BASE_CIDR: "{{ firecracker.tap_base_cidr | default('172.16.0.0/20') }}"
      SB_FIRECRACKER_TAP_POOL_SIZE: "{{ firecracker.tap_pool_size | default(256) }}"
      # Secret path: keyed off whether the operator supplied a wrap key in
      # config/secrets.yml (aocr.upstream_wrap_key) OR via a control-node
      # file (sandboxd_upstream_wrap_key_src in local.yml). Empty path = no
      # key, sandboxd skips wrap-key delivery.
      SB_UPSTREAM_WRAP_KEY_PATH: "{{ sandboxd_upstream_wrap_key_path if ((sandboxd_upstream_wrap_key_src | length > 0) or (aocr.upstream_wrap_key | length > 0)) else '' }}"
      SB_AUTO_IMPORT_ENABLED: "{{ auto_import.enabled | bool | string | lower }}"
      SB_AUTO_IMPORT_HOOKS_URL: "{{ auto_import.hooks_url }}"
      SB_AUTO_IMPORT_CLUSTER_ID: "{{ auto_import.cluster_id }}"
      # Same secrets.yml-vs-src split as the wrap key.
      SB_AUTO_IMPORT_CLUSTER_PAT_PATH: "{{ sandboxd_auto_import_cluster_pat_path if ((sandboxd_auto_import_cluster_pat_src | length > 0) or (aocr.cluster_pat | length > 0)) else '' }}"
      # Shared SSH host key path (UC-22). Always the default location; the
      # host-key tasks below write a shared key there only when one is provided,
      # otherwise sandboxd generates a per-node key at this path on first boot.
      SB_SSH_HOST_KEY_PATH: "{{ sandboxd_ssh_host_key_path }}"
      SB_AUTO_IMPORT_RETENTION_SUFFIX: "{{ auto_import.retention_suffix }}"
      SB_AUTO_IMPORT_REQUEST_TIMEOUT: "{{ auto_import.request_timeout }}"
      SB_AUTO_IMPORT_RECONCILE_INTERVAL: "{{ auto_import.reconcile_interval }}"
      SB_AUTO_IMPORT_MAX_IN_FLIGHT: "{{ auto_import.max_in_flight }}"
      # Fleet control plane (optional). enabled/endpoint/contract_refresh come
      # from cluster.yml's fleet_control_plane block; the token is a secret
      # from secrets.yml's separate `fleet` key. Only these land in env — every
      # other tunable is fetched from the managed contract API at runtime. The
      # token rides cluster.env (root 0600) rather than a dedicated file like
      # the cluster PAT; switching to an SB_FLEET_TOKEN_PATH file is a possible
      # hardening follow-up.
      SB_FLEET_ENABLED: "{{ fleet_control_plane.enabled | bool | string | lower }}"
      SB_FLEET_ENDPOINT: "{{ fleet_control_plane.endpoint }}"
      SB_FLEET_TOKEN: "{{ fleet.token }}"
      SB_FLEET_CONTRACT_REFRESH: "{{ fleet_control_plane.contract_refresh }}"
      # WASM runtime + module distribution. SB_WASM_STANDARD_MODULES is derived
      # from wasm.standard_modules so the reserved-keyword contract (alias ->
      # "<alias>.wasm") is identical on every node — never DB-backed.
      SB_ENABLE_WASM: "{{ wasm.enabled | default(false) | bool | string | lower }}"
      SB_WASM_MODULES_DIR: "{{ wasm.modules_dir | default('/var/lib/sandboxd/wasm/modules') }}"
      SB_WASM_CACHE_DIR: "{{ wasm.cache_dir | default('') }}"
      SB_WASM_POOL_ENABLED: "{{ wasm.pool.enabled | default(true) | bool | string | lower }}"
      SB_WASM_POOL_DEPTH_DEFAULT: "{{ wasm.pool.depth_default | default(2) | int }}"
      SB_WASM_REGISTRY_ALLOWLIST: "{{ wasm.registry_allowlist | default('') }}"
      SB_WASM_PULL_TIMEOUT: "{{ wasm.pull_timeout | default('60s') }}"
      SB_WASM_REGISTRY_PUSH_HOST: "{{ wasm.push_host | default('') }}"
      SB_WASM_REGISTRY_USERNAME: "{{ wasm.registry_username | default('') }}"
      SB_WASM_REGISTRY_PAT_PATH: "{{ wasm.registry_pat_path | default('') }}"
      SB_WASM_STANDARD_MODULES: "{{ wasm.standard_modules | default([]) | map(attribute='alias') | map('regex_replace', '^(.*)$', '\\1=\\1.wasm') | join(',') }}"
      # Docker warm container pool (park + adopt). Defaults mirror config.go
      # and Terraform's docker_pool_cfg so day-0 and day-2 render identically.
      SB_DOCKER_POOL_ENABLED: "{{ docker.pool.enabled | default(false) | bool | string | lower }}"
      SB_DOCKER_POOL_DEPTH: "{{ docker.pool.depth | default(2) | int }}"
      SB_DOCKER_POOL_IMAGES: "{{ docker.pool.images | default([]) | join(',') }}"
      SB_DOCKER_POOL_MAX_IMAGES: "{{ docker.pool.max_images | default(8) | int }}"
      SB_DOCKER_POOL_IDLE_TTL: "{{ docker.pool.idle_ttl | default('15m') }}"
      SB_DOCKER_POOL_REFILL_INTERVAL: "{{ docker.pool.refill_interval | default('5s') }}"
      # Docker pause-netns pool (image-agnostic prepaid network namespaces).
      # Defaults mirror config.go; pause_image must be pullable from the node
      # or overridden to a mirror.
      SB_DOCKER_NETNS_POOL_ENABLED: "{{ docker.netns_pool.enabled | default(false) | bool | string | lower }}"
      SB_DOCKER_NETNS_POOL_DEPTH: "{{ docker.netns_pool.depth | default(4) | int }}"
      SB_DOCKER_NETNS_POOL_PAUSE_IMAGE: "{{ docker.netns_pool.pause_image | default('registry.k8s.io/pause:3.10') }}"
      SB_DOCKER_NETNS_POOL_REFILL_INTERVAL: "{{ docker.netns_pool.refill_interval | default('2s') }}"
      # Container engine (plans/containerd-engine.md Phase 5). Default containerd
      # for server deployments; set container_engine: docker in
      # config/cluster.yml to keep a legacy dockerd host. This play installs CNI
      # plugins under containerd.cni_plugin_dir when the engine is containerd.
      SB_CONTAINER_ENGINE: "{{ container_engine | default('containerd') }}"
      SB_CONTAINERD_SOCKET: "{{ containerd.socket | default('/run/containerd/containerd.sock') }}"
      SB_CONTAINERD_NAMESPACE: "{{ containerd.namespace | default('aerolvm') }}"
      SB_CONTAINERD_CNI_PLUGIN_DIR: "{{ containerd.cni_plugin_dir | default('/opt/cni/bin') }}"
      SB_CONTAINERD_NATIVE_NETNS_POOL_ENABLED: "{{ containerd.native_netns_pool_enabled | default(true) | bool | string | lower }}"

    # S3 Object Lock audit witness (plans/open-audit-witness.md). Kept out of
    # sandboxd_ops_env because it is written only when
    # sandboxd_audit_witness_backend is set: Terraform writes the same block
    # at day 0, and a day-2 run with the empty defaults must not erase it (see
    # group_vars/all/defaults.yml).
    sandboxd_audit_witness_env:
      SB_AUDIT_WITNESS_BACKEND: "{{ sandboxd_audit_witness_backend }}"
      SB_AUDIT_WITNESS_S3_BUCKET: "{{ sandboxd_audit_witness_s3_bucket }}"
      SB_AUDIT_WITNESS_S3_PREFIX: "{{ sandboxd_audit_witness_s3_prefix }}"
      SB_AUDIT_WITNESS_S3_REGION: "{{ sandboxd_audit_witness_s3_region }}"
      SB_AUDIT_WITNESS_S3_ENDPOINT: "{{ sandboxd_audit_witness_s3_endpoint }}"
      SB_AUDIT_WITNESS_S3_PATH_STYLE: "{{ sandboxd_audit_witness_s3_path_style | bool | string | lower }}"

  pre_tasks:
    - name: Check base sandboxd env file
      ansible.builtin.stat:
        path: "{{ sandboxd_env_file }}"
      register: sandboxd_base_env

    - name: Refuse when base sandboxd env file is missing
      ansible.builtin.assert:
        that:
          - sandboxd_base_env.stat.exists
        fail_msg: "{{ sandboxd_env_file }} is missing; run install.sh/bootstrap first."

    - name: Check cluster env file
      ansible.builtin.stat:
        path: "{{ sandboxd_cluster_env_file }}"
      register: sandboxd_cluster_env

    - name: Pick env file to manage
      ansible.builtin.set_fact:
        sandboxd_ops_env_file: "{{ sandboxd_cluster_env_file if sandboxd_cluster_env.stat.exists else sandboxd_env_file }}"

    # SB_NODE_ID is identity: the Raft member id and the node:<id> certificate
    # SAN in a cluster, and the witness key on every node. Read the value the
    # daemon boots with today (systemd keeps the last assignment, and the
    # cluster.env drop-in loads after sandboxd.env) so the checks below compare
    # against the real value, not a guess.
    - name: Read the SB_NODE_ID sandboxd boots with
      ansible.builtin.shell: >-
        cat {{ sandboxd_env_file | quote }} {{ sandboxd_cluster_env_file | quote }} 2>/dev/null
        | sed -n 's/^SB_NODE_ID=//p' | tail -n 1
      register: sandboxd_current_node_id
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to change an existing SB_NODE_ID
      when:
        - sandboxd_node_id | length > 0
        - sandboxd_current_node_id.stdout | default('') | trim | length > 0
      ansible.builtin.assert:
        that:
          - sandboxd_node_id == (sandboxd_current_node_id.stdout | trim)
        fail_msg: >-
          {{ inventory_hostname }} already boots as SB_NODE_ID={{ sandboxd_current_node_id.stdout | trim }}
          and sandboxd_node_id asks for {{ sandboxd_node_id }}. A new node id is a
          rebuild, not a config change: in a cluster it is a new Raft member and a
          new certificate, and the witness history stays under the old id. Follow
          setup/runbooks/secrets-and-audit.md, "Rebuild a node under a new SB_NODE_ID".

    # sandboxd_node_id set in group_vars instead of per host would give every
    # host the same id. Inventory vars are visible for all hosts even under
    # serial: 1, so this catches it before the first host is touched.
    - name: Refuse the same sandboxd_node_id on two hosts
      run_once: true
      vars:
        sandboxd_requested_node_ids: >-
          {{ ansible_play_hosts_all | map('extract', hostvars, 'sandboxd_node_id')
             | select('string') | reject('equalto', '') | list }}
      ansible.builtin.assert:
        that:
          - sandboxd_requested_node_ids | length == (sandboxd_requested_node_ids | unique | length)
        fail_msg: >-
          Two or more hosts ask for the same sandboxd_node_id
          ({{ sandboxd_requested_node_ids | sort | join(', ') }}). Node ids must be
          unique; set sandboxd_node_id per host (host_vars), never in group_vars.

    # The daemon refuses these at boot too. Checking here stops the play before
    # the restart handler takes a healthy node down into a refused boot.
    - name: Refuse an incomplete S3 audit witness config
      when: sandboxd_audit_witness_backend | length > 0
      ansible.builtin.assert:
        that:
          - sandboxd_audit_witness_backend == 's3'
          - sandboxd_audit_witness_s3_bucket | length > 0
        fail_msg: >-
          sandboxd_audit_witness_backend must be "s3" (or empty for no witness), and
          s3 needs sandboxd_audit_witness_s3_bucket.

    - name: Refuse an S3 audit witness without a unique SB_NODE_ID
      when: sandboxd_audit_witness_backend | length > 0
      vars:
        sandboxd_effective_node_id: >-
          {{ sandboxd_node_id if (sandboxd_node_id | length > 0)
             else (sandboxd_current_node_id.stdout | default('') | trim) }}
      ansible.builtin.assert:
        that:
          - sandboxd_effective_node_id | trim | length > 0
          - sandboxd_effective_node_id | trim != 'standalone'
        fail_msg: >-
          {{ inventory_hostname }} has no SB_NODE_ID (or has "standalone"). The witness
          files heads under the node id, and every single server without one is
          "standalone", so two servers sharing a bucket would overwrite each other's
          heads and refuse to restart. Set sandboxd_node_id for this host to an id
          that is unique among servers sharing the bucket.

  tasks:
    - name: Deploy sandboxd backup/recovery helpers
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ sandboxd_ops_script_dir }}/{{ item.dest }}"
        mode: "0755"
        owner: root
        group: root
      loop:
        - { src: "../../scripts/sandboxd-backup.sh", dest: "sandboxd-backup.sh" }
        - { src: "../../scripts/sandboxd-restore.sh", dest: "sandboxd-restore.sh" }
        - { src: "../../scripts/raft-lost-quorum-recover.sh", dest: "raft-lost-quorum-recover.sh" }
        - { src: "../../scripts/sandboxd-node-lifecycle.sh", dest: "sandboxd-node-lifecycle.sh" }

    - name: Create Grafana dashboard artifact directory
      ansible.builtin.file:
        path: "{{ sandboxd_grafana_dashboard_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Deploy Grafana SLO dashboard JSON
      ansible.builtin.copy:
        src: "../../setup/grafana/sandboxd-slo-dashboard.json"
        dest: "{{ sandboxd_grafana_dashboard_dir }}/sandboxd-slo-dashboard.json"
        mode: "0644"
        owner: root
        group: root

    - name: Create Prometheus alert rule artifact directory
      ansible.builtin.file:
        path: "{{ sandboxd_prometheus_rules_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Deploy Prometheus alert rules
      ansible.builtin.copy:
        src: "../../setup/prometheus/sandboxd-alerts.yml"
        dest: "{{ sandboxd_prometheus_rules_dir }}/sandboxd-alerts.yml"
        mode: "0644"
        owner: root
        group: root

    - name: Create Alertmanager example artifact directory
      ansible.builtin.file:
        path: "{{ sandboxd_alertmanager_config_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Deploy Alertmanager example config
      ansible.builtin.copy:
        src: "../../setup/alertmanager/sandboxd-alertmanager-example.yml"
        dest: "{{ sandboxd_alertmanager_config_dir }}/sandboxd-alertmanager-example.yml"
        mode: "0644"
        owner: root
        group: root

    - name: Create runbook artifact directory
      ansible.builtin.file:
        path: "{{ sandboxd_runbook_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Deploy sandboxd operational runbooks
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ sandboxd_runbook_dir }}/{{ item | basename }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - "../../setup/runbooks/README.md"
        - "../../setup/runbooks/backup-restore.md"
        - "../../setup/runbooks/lost-quorum-recovery.md"
        - "../../setup/runbooks/image-pull-storm.md"
        - "../../setup/runbooks/slo-breach.md"
        - "../../setup/runbooks/containerd-engine-coexistence.md"
        - "../../setup/runbooks/cluster-ingress-topology.md"

    - name: Ensure sandboxd secrets directory exists
      when: >-
        (sandboxd_upstream_wrap_key_src | length > 0)
        or (aocr.upstream_wrap_key | length > 0)
        or (sandboxd_auto_import_cluster_pat_src | length > 0)
        or (aocr.cluster_pat | length > 0)
      ansible.builtin.file:
        path: "{{ sandboxd_secrets_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root

    # Firecracker host-side install. Runs only when firecracker.enabled is
    # true in config/cluster.yml. Arch is detected from uname -m so operators
    # don't have to hand-craft per-arch URLs (mirrors the runsc pattern in
    # scripts/install.sh:install_runsc_binary). Unsupported arches fail
    # immediately rather than producing a sandboxd that fails to start hours
    # later when a Firecracker sandbox is first requested.
    - name: Detect host architecture for Firecracker
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.command: uname -m
      register: firecracker_uname_m
      changed_when: false

    - name: Map host arch → Firecracker release arch
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.set_fact:
        # Firecracker upstream + spec.ccfc.min both publish only x86_64 and
        # aarch64. Map common uname -m outputs to those two; anything else
        # trips the assert below.
        firecracker_arch: >-
          {{
            {
              'x86_64': 'x86_64',
              'amd64':  'x86_64',
              'aarch64': 'aarch64',
              'arm64':   'aarch64',
            }.get(firecracker_uname_m.stdout | trim, '')
          }}

    - name: Refuse when host arch is not supported by Firecracker
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.assert:
        that:
          - firecracker_arch | length > 0
        fail_msg: >-
          Firecracker only ships x86_64 and aarch64 binaries; this host
          reports uname -m={{ firecracker_uname_m.stdout | trim }}.
          Either disable firecracker.enabled in config/cluster.yml or
          exclude this host from the run.

    - name: Check for /dev/kvm on host
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.stat:
        path: /dev/kvm
      register: firecracker_kvm

    - name: Refuse when host has no /dev/kvm
      # Firecracker is a KVM-only VMM. Without /dev/kvm there is nothing to
      # install onto — sandboxd would fail at first CreateSandbox(runtime=
      # firecracker). Catch it here with a paste-able remediation instead of
      # the default "failed_when_result: true" stack trace.
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.assert:
        that:
          - firecracker_kvm.stat.exists
        fail_msg: |
          /dev/kvm is missing on {{ inventory_hostname }} ({{ firecracker_uname_m.stdout | trim }}).
          Firecracker is KVM-only and CANNOT run on this host.

          Most likely cause: this host does not expose hardware virtualization.
            * AWS EC2: only bare-metal instance types pass KVM through. Use
              *.metal (c5n.metal, m5zn.metal, c7g.metal, i3.metal, m5.metal,
              c5.metal, etc.). Standard t3/m5/c5/c6i/m6i/r5 instances are
              themselves Nitro guests and do not have /dev/kvm.
            * GCP: enable nested virtualization on the image (only N2/N1
              with --enable-nested-virtualization).
            * Azure: only Dv3/Ev3 and later with nested virt support.
            * Bare metal / on-prem: enable Intel VT-x / AMD-V in BIOS, then
              `sudo modprobe kvm_intel` (or kvm_amd).

          To proceed WITHOUT Firecracker on this host:
            1. Edit ../config/cluster.yml and set:
                 firecracker:
                   enabled: false
            2. Re-run: ansible-playbook playbooks/configure-ops.yml

          To install Firecracker only on capable hosts, keep
          firecracker.enabled: true in config/cluster.yml and target the
          play with --limit at a group that excludes non-KVM hosts.

    - name: Compute Firecracker upstream download URLs
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.set_fact:
        # Tarball layout: release-<ver>-<arch>/firecracker-<ver>-<arch>
        #                 release-<ver>-<arch>/jailer-<ver>-<arch>
        # Sidecar checksum: <tarball>.sha256.txt (single-line "<hash>  <file>").
        firecracker_release_base: >-
          https://github.com/firecracker-microvm/firecracker/releases/download/{{ firecracker_version }}
        firecracker_release_tarball: "firecracker-{{ firecracker_version }}-{{ firecracker_arch }}.tgz"
        # Kernel: spec.ccfc.min is the upstream-blessed kernel bucket. Path
        # layout is firecracker-ci/<ci_version>/<arch>/vmlinux-<kernel_version>.
        firecracker_kernel_default_url: >-
          https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/{{ firecracker_kernel_ci_version }}/{{ firecracker_arch }}/vmlinux-{{ firecracker_kernel_version }}
        firecracker_kernel_config_default_url: >-
          https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/{{ firecracker_kernel_ci_version }}/{{ firecracker_arch }}/vmlinux-{{ firecracker_kernel_version }}.config

    - name: Ensure Firecracker install directories exist
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      loop:
        - "{{ firecracker.binary_path | default('/usr/local/bin/firecracker') | dirname }}"
        - "{{ firecracker.jailer_path | default('/usr/local/bin/jailer') | dirname }}"
        - "{{ firecracker.kernel_path | default('/var/lib/sandboxd/firecracker/vmlinux') | dirname }}"
        - "{{ firecracker.run_dir | default('/run/sandboxd/firecracker') }}"
        - "{{ firecracker.templates_dir | default('/var/lib/sandboxd/firecracker/templates') }}"
        - "{{ firecracker.jailer_chroot_base | default('/srv/jailer') }}"

    - name: Stat installed Firecracker binary
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.stat:
        path: "{{ firecracker.binary_path | default('/usr/local/bin/firecracker') }}"
      register: firecracker_installed_bin

    - name: Probe installed Firecracker version
      when:
        - firecracker.enabled | default(false) | bool
        - firecracker_installed_bin.stat.exists
      ansible.builtin.command: "{{ firecracker.binary_path | default('/usr/local/bin/firecracker') }} --version"
      register: firecracker_installed_version
      changed_when: false
      failed_when: false

    # Skip the download/extract dance when the installed binary already
    # reports the requested version. `firecracker --version` prints e.g.
    # "Firecracker v1.10.1". Re-runs of configure-ops.yml stay fast.
    - name: Install Firecracker + jailer from upstream release
      when:
        - firecracker.enabled | default(false) | bool
        - firecracker_binary_url | length == 0
        - (not firecracker_installed_bin.stat.exists) or (firecracker_version not in (firecracker_installed_version.stdout | default('')))
      block:
        - name: Create temp workspace for Firecracker release
          ansible.builtin.tempfile:
            state: directory
            suffix: firecracker
          register: firecracker_tmp

        - name: Download Firecracker release tarball
          ansible.builtin.get_url:
            url: "{{ firecracker_release_base }}/{{ firecracker_release_tarball }}"
            dest: "{{ firecracker_tmp.path }}/{{ firecracker_release_tarball }}"
            mode: "0644"

        - name: Download Firecracker release SHA256 sidecar
          ansible.builtin.get_url:
            url: "{{ firecracker_release_base }}/{{ firecracker_release_tarball }}.sha256.txt"
            dest: "{{ firecracker_tmp.path }}/{{ firecracker_release_tarball }}.sha256.txt"
            mode: "0644"

        - name: Verify Firecracker release tarball SHA256
          # sha256sum -c reads "<hash>  <file>" and exits non-zero on mismatch.
          # Run from the tmp dir so the relative <file> in the sidecar resolves.
          ansible.builtin.command:
            cmd: "sha256sum -c {{ firecracker_release_tarball }}.sha256.txt"
            chdir: "{{ firecracker_tmp.path }}"
          changed_when: false

        - name: Extract Firecracker release tarball
          ansible.builtin.unarchive:
            src: "{{ firecracker_tmp.path }}/{{ firecracker_release_tarball }}"
            dest: "{{ firecracker_tmp.path }}"
            remote_src: true

        - name: Install Firecracker binary
          ansible.builtin.copy:
            src: "{{ firecracker_tmp.path }}/release-{{ firecracker_version }}-{{ firecracker_arch }}/firecracker-{{ firecracker_version }}-{{ firecracker_arch }}"
            dest: "{{ firecracker.binary_path | default('/usr/local/bin/firecracker') }}"
            mode: "0755"
            owner: root
            group: root
            remote_src: true

        - name: Install jailer binary
          ansible.builtin.copy:
            src: "{{ firecracker_tmp.path }}/release-{{ firecracker_version }}-{{ firecracker_arch }}/jailer-{{ firecracker_version }}-{{ firecracker_arch }}"
            dest: "{{ firecracker.jailer_path | default('/usr/local/bin/jailer') }}"
            mode: "0755"
            owner: root
            group: root
            remote_src: true
      always:
        - name: Remove Firecracker release workspace
          ansible.builtin.file:
            path: "{{ firecracker_tmp.path }}"
            state: absent
          when: firecracker_tmp.path is defined

    # Operator override path: a private mirror URL bypasses the upstream
    # GitHub fetch entirely. Binary and jailer overrides are independent so
    # operators can mix-and-match (e.g. host the binary internally, take
    # jailer from upstream).
    - name: Download Firecracker binary from operator-supplied URL
      when:
        - firecracker.enabled | default(false) | bool
        - firecracker_binary_url | length > 0
      ansible.builtin.get_url:
        url: "{{ firecracker_binary_url }}"
        dest: "{{ firecracker.binary_path | default('/usr/local/bin/firecracker') }}"
        mode: "0755"
        owner: root
        group: root
        force: no

    - name: Download jailer from operator-supplied URL
      when:
        - firecracker.enabled | default(false) | bool
        - firecracker_jailer_url | length > 0
      ansible.builtin.get_url:
        url: "{{ firecracker_jailer_url }}"
        dest: "{{ firecracker.jailer_path | default('/usr/local/bin/jailer') }}"
        mode: "0755"
        owner: root
        group: root
        force: no

    - name: Download Firecracker guest kernel image
      # Operator URL wins when set; otherwise pull the arch-matched vmlinux
      # from the upstream spec.ccfc.min bucket. force: no preserves any
      # locally-built kernel an operator dropped in by hand.
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.get_url:
        url: "{{ firecracker_kernel_url if (firecracker_kernel_url | length > 0) else firecracker_kernel_default_url }}"
        dest: "{{ firecracker.kernel_path | default('/var/lib/sandboxd/firecracker/vmlinux') }}"
        mode: "0644"
        owner: root
        group: root
        force: no

    - name: Download Firecracker guest kernel config
      # sandboxd uses this sidecar to prove CONFIG_VMGENID=y before advertising
      # snapshot-clone entropy correctness on /health.
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.get_url:
        url: "{{ firecracker_kernel_config_url if (firecracker_kernel_config_url | length > 0) else (firecracker_kernel_url ~ '.config' if (firecracker_kernel_url | length > 0) else firecracker_kernel_config_default_url) }}"
        dest: "{{ firecracker.kernel_path | default('/var/lib/sandboxd/firecracker/vmlinux') }}.config"
        mode: "0644"
        owner: root
        group: root
        force: no

    - name: Verify Firecracker guest kernel enables vmgenid
      when: firecracker.enabled | default(false) | bool
      ansible.builtin.command: "grep -qx CONFIG_VMGENID=y {{ firecracker.kernel_path | default('/var/lib/sandboxd/firecracker/vmlinux') }}.config"
      changed_when: false

    # Upstream wrap key (Phase 4 F17). Two delivery modes:
    #   * shared SoT      -> aocr.upstream_wrap_key in config/secrets.yml
    #   * control-node file -> sandboxd_upstream_wrap_key_src (fleet / Vault rendering)
    # If both are set, the secrets.yml value wins (it runs first).
    - name: Install upstream wrap key (from config/secrets.yml)
      when: aocr.upstream_wrap_key | length > 0
      ansible.builtin.copy:
        content: "{{ aocr.upstream_wrap_key }}\n"
        dest: "{{ sandboxd_upstream_wrap_key_path }}"
        mode: "0600"
        owner: root
        group: root
      no_log: true
      notify: Apply sandboxd ops config

    - name: Install upstream wrap key (from control-node file)
      when:
        - sandboxd_upstream_wrap_key_src | length > 0
        - (aocr.upstream_wrap_key | length) == 0
      ansible.builtin.copy:
        src: "{{ sandboxd_upstream_wrap_key_src }}"
        dest: "{{ sandboxd_upstream_wrap_key_path }}"
        mode: "0600"
        owner: root
        group: root
      notify: Apply sandboxd ops config

    # Cluster PAT for auto-import (Phase 4 F21). Same two-mode pattern.
    - name: Install cluster PAT for auto-import (from config/secrets.yml)
      when: aocr.cluster_pat | length > 0
      ansible.builtin.copy:
        content: "{{ aocr.cluster_pat }}\n"
        dest: "{{ sandboxd_auto_import_cluster_pat_path }}"
        mode: "0600"
        owner: root
        group: root
      no_log: true
      notify: Apply sandboxd ops config

    - name: Install cluster PAT for auto-import (from control-node file)
      when:
        - sandboxd_auto_import_cluster_pat_src | length > 0
        - (aocr.cluster_pat | length) == 0
      ansible.builtin.copy:
        src: "{{ sandboxd_auto_import_cluster_pat_src }}"
        dest: "{{ sandboxd_auto_import_cluster_pat_path }}"
        mode: "0600"
        owner: root
        group: root
      notify: Apply sandboxd ops config

    # Shared SSH host key (UC-22). Same two-mode pattern as the secrets above:
    # config/secrets.yml `ssh.host_key` wins over a control-node file. When
    # neither is set the tasks skip and sandboxd generates a per-node key at
    # sandboxd_ssh_host_key_path on first boot.
    - name: Ensure sandboxd state directory exists (shared SSH host key)
      when: >-
        ((ssh | default({})).host_key | default('') | length > 0)
        or (sandboxd_ssh_host_key_src | length > 0)
      ansible.builtin.file:
        path: "{{ sandboxd_ssh_host_key_path | dirname }}"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Install shared SSH host key (from config/secrets.yml)
      when: (ssh | default({})).host_key | default('') | length > 0
      ansible.builtin.copy:
        content: "{{ (ssh | default({})).host_key }}\n"
        dest: "{{ sandboxd_ssh_host_key_path }}"
        mode: "0600"
        owner: root
        group: root
      no_log: true
      notify: Apply sandboxd ops config

    - name: Install shared SSH host key (from control-node file)
      when:
        - sandboxd_ssh_host_key_src | length > 0
        - ((ssh | default({})).host_key | default('') | length) == 0
      ansible.builtin.copy:
        src: "{{ sandboxd_ssh_host_key_src }}"
        dest: "{{ sandboxd_ssh_host_key_path }}"
        mode: "0600"
        owner: root
        group: root
      notify: Apply sandboxd ops config

    # CNI plugins for containerd native netns (plans/containerd-engine.md Phase 5).
    # Mirrors scripts/install.sh install_cni_plugins; only when cluster.yml flips
    # container_engine to containerd. Idempotent: skip when bridge already present.
    - name: Resolve CNI plugin architecture
      when: (container_engine | default('docker')) == 'containerd'
      ansible.builtin.set_fact:
        sandboxd_cni_arch: "{{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else ('arm64' if ansible_architecture in ['aarch64', 'arm64'] else '') }}"

    - name: Refuse unknown architecture for CNI plugins
      when:
        - (container_engine | default('docker')) == 'containerd'
        - sandboxd_cni_arch | length == 0
      ansible.builtin.fail:
        msg: "container_engine=containerd requires amd64/arm64 for CNI plugins (got {{ ansible_architecture }})"

    - name: Check CNI bridge plugin present
      when: (container_engine | default('docker')) == 'containerd'
      ansible.builtin.stat:
        path: "{{ (containerd.cni_plugin_dir | default('/opt/cni/bin')) }}/bridge"
      register: sandboxd_cni_bridge

    - name: Install CNI plugins for containerd engine
      when:
        - (container_engine | default('docker')) == 'containerd'
        - not (sandboxd_cni_bridge.stat.exists | default(false))
      block:
        - name: Create CNI plugin directory
          ansible.builtin.file:
            path: "{{ containerd.cni_plugin_dir | default('/opt/cni/bin') }}"
            state: directory
            mode: "0755"
            owner: root
            group: root

        - name: Create temp workspace for CNI plugins
          ansible.builtin.tempfile:
            state: directory
            suffix: cni
          register: sandboxd_cni_tmp

        - name: Download CNI plugins release
          ansible.builtin.get_url:
            url: "https://github.com/containernetworking/plugins/releases/download/{{ sandboxd_cni_plugins_version }}/cni-plugins-linux-{{ sandboxd_cni_arch }}-{{ sandboxd_cni_plugins_version }}.tgz"
            dest: "{{ sandboxd_cni_tmp.path }}/cni.tgz"
            mode: "0644"

        - name: Extract CNI plugins
          ansible.builtin.unarchive:
            src: "{{ sandboxd_cni_tmp.path }}/cni.tgz"
            dest: "{{ containerd.cni_plugin_dir | default('/opt/cni/bin') }}"
            remote_src: true
            extra_opts: ["--no-same-owner"]

        - name: Verify required CNI plugins
          ansible.builtin.stat:
            path: "{{ (containerd.cni_plugin_dir | default('/opt/cni/bin')) }}/{{ item }}"
          loop: [bridge, host-local, loopback]
          register: sandboxd_cni_plugins

        - name: Assert CNI plugins installed
          ansible.builtin.assert:
            that:
              - item.stat.exists
            fail_msg: "expected CNI plugin missing under {{ containerd.cni_plugin_dir | default('/opt/cni/bin') }}"
          loop: "{{ sandboxd_cni_plugins.results }}"
      always:
        - name: Remove CNI plugin workspace
          ansible.builtin.file:
            path: "{{ sandboxd_cni_tmp.path }}"
            state: absent
          when: sandboxd_cni_tmp.path is defined

    # sandboxd_ops_env at the top of the play renders from cluster.yml plus
    # the local-only secret paths. No skip-on-empty: both Ansible and
    # Terraform project from the same SoT, so writing the full dict can't
    # accidentally clobber a value the other tool set.
    - name: Write sandboxd operational env vars
      ansible.builtin.lineinfile:
        path: "{{ sandboxd_ops_env_file }}"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        create: false
        mode: "0600"
        owner: root
        group: root
      loop: "{{ sandboxd_ops_env | dict2items }}"
      notify: Apply sandboxd ops config

    # Only ever written, never removed: an empty sandboxd_node_id leaves the
    # line alone, because on a cluster node it is cluster-init/cluster-join's
    # identity and an empty write would orphan the Raft member.
    - name: Write SB_NODE_ID
      when: sandboxd_node_id | length > 0
      ansible.builtin.lineinfile:
        path: "{{ sandboxd_ops_env_file }}"
        regexp: "^SB_NODE_ID="
        line: "SB_NODE_ID={{ sandboxd_node_id }}"
        create: false
        mode: "0600"
        owner: root
        group: root
      notify: Apply sandboxd ops config

    # With a backend set, Ansible owns the whole block: a non-empty value is
    # written and an empty one is removed, so the daemon falls back to its
    # default instead of reading an explicit empty string.
    - name: Write S3 audit witness env vars
      when: sandboxd_audit_witness_backend | length > 0
      ansible.builtin.lineinfile:
        path: "{{ sandboxd_ops_env_file }}"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        state: "{{ 'present' if (item.value | string | length > 0) else 'absent' }}"
        create: false
        mode: "0600"
        owner: root
        group: root
      loop: "{{ sandboxd_audit_witness_env | dict2items }}"
      notify: Apply sandboxd ops config

    - name: Create backup output directory
      when: sandboxd_backup_enabled | bool
      ansible.builtin.file:
        path: "{{ sandboxd_backup_output_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Configure local sandboxd backup cron
      when: sandboxd_backup_enabled | bool
      ansible.builtin.cron:
        name: sandboxd local backup
        minute: "{{ sandboxd_backup_cron_minute }}"
        hour: "{{ sandboxd_backup_cron_hour }}"
        user: root
        job: >-
          {{ sandboxd_ops_script_dir }}/sandboxd-backup.sh
          --output {{ sandboxd_backup_output_dir }}/sandboxd-$(hostname)-$(date +\%F-\%H\%M\%S).tar.gz
          && find {{ sandboxd_backup_output_dir }} -type f -name 'sandboxd-*.tar.gz'
          -mtime +{{ sandboxd_backup_retention_days }} -delete

    - name: Remove local sandboxd backup cron
      when: not (sandboxd_backup_enabled | bool)
      ansible.builtin.cron:
        name: sandboxd local backup
        user: root
        state: absent

  handlers:
    - name: Restart sandboxd
      listen: Apply sandboxd ops config
      when: sandboxd_restart_after_ops_config | bool
      ansible.builtin.systemd:
        name: "{{ sandboxd_service_name }}"
        state: restarted
        daemon_reload: false

    - name: Wait for sandboxd health
      listen: Apply sandboxd ops config
      when: sandboxd_restart_after_ops_config | bool
      ansible.builtin.uri:
        url: "{{ sandboxd_health_url }}"
        status_code: 200
        return_content: false
      register: health
      until: health.status == 200
      retries: "{{ sandboxd_health_wait_s }}"
      delay: 1
