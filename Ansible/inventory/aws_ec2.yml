# Dynamic inventory: every EC2 instance tagged Cluster=<aerolvm_cluster_name>
# in <aws_region> shows up as a host. Group membership is derived from the
# Role and Seed tags Terraform sets in nodes.tf.
#
# Override the defaults from the CLI without editing this file:
#   AEROLVM_CLUSTER=aerolvm AEROLVM_REGION=us-east-1 ansible-inventory --graph

plugin: amazon.aws.aws_ec2

regions:
  - "{{ lookup('env', 'AEROLVM_REGION') | default('us-east-1', true) }}"

filters:
  tag:Cluster: "{{ lookup('env', 'AEROLVM_CLUSTER') | default('aerolvm', true) }}"
  instance-state-name: running

hostnames:
  - tag:Name
  - public-ip-address

compose:
  ansible_host: public_ip_address
  node_name:    ec2_tags.Name
  node_role:    ec2_tags.Role
  is_seed:      ec2_tags.Seed == 'true'

# Build groups from tags so playbooks can target subsets.
#   - aerolvm_role_server / aerolvm_role_worker / aerolvm_role_ingress /
#     aerolvm_role_mixed / aerolvm_role_worker_ingress / ...
#   - aerolvm_seed (exactly one host) / aerolvm_joiner (everyone else)
keyed_groups:
  - key: ec2_tags.Role | regex_replace(',', '_')
    prefix: aerolvm_role
    separator: _
  - key: ec2_tags.Seed
    prefix: aerolvm
    separator: _
