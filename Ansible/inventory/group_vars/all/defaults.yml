# Defaults shared by every playbook. File name matters: Ansible loads every
# *.yml in group_vars/all/ alphabetically and later files win, so this file
# must sort BEFORE local.yml. Keep it named defaults.yml (don't rename to
# main.yml / vars.yml / etc. — those would sort AFTER local.yml and silently
# clobber the overrides).
#
# Override per-operator in this directory's local.yml (gitignored).
# Override per-invocation with `-e key=value`.
#
# This file holds ONLY mandatory plumbing + safe defaults that ship the
# feature OFF. To opt into a feature (mirror, auto-import, OTEL, backup,
# etc.), copy the relevant block into local.yml and set the values there.
# Do not enable optional features here — they would apply to every operator
# who checks out this repo.

# --- Core paths and service identity ----------------------------------------
sandboxd_binary_path:   /usr/local/bin/sandboxd
sandboxd_service_name:  sandboxd
# Toolboxd is the in-container agent; it's bind-mounted into every sandbox
# from this host path (see pkg/docker/client.go and packaging/.env.template).
toolboxd_binary_path:   /usr/local/bin/toolboxd
sandboxd_env_file:      /etc/sandboxd/sandboxd.env
sandboxd_cluster_env_file: /etc/sandboxd/cluster.env
sandboxd_health_url:    "http://127.0.0.1:21212/health"
sandboxd_health_wait_s: 30
sandboxd_ops_script_dir: /usr/local/sbin
sandboxd_lifecycle_script_path: /usr/local/sbin/sandboxd-node-lifecycle.sh
sandboxd_grafana_dashboard_dir: /etc/sandboxd/grafana
sandboxd_prometheus_rules_dir: /etc/sandboxd/prometheus
sandboxd_alertmanager_config_dir: /etc/sandboxd/alertmanager
sandboxd_runbook_dir: /etc/sandboxd/runbooks
sandboxd_restart_after_ops_config: true

# --- Observability / image controls / mirror / auto-import -----------------
# These now live in ../../../../config/cluster.yml (shared with Terraform).
# Edit that file; configure-ops.yml loads it via vars_files. Only Ansible-
# specific secret-delivery vars remain in this file (below) and in local.yml.

# --- Local backup schedule -------------------------------------------------
# OFF by default. To enable, set sandboxd_backup_enabled: true in local.yml.
sandboxd_backup_enabled: false
sandboxd_backup_output_dir: /var/backups/sandboxd
sandboxd_backup_cron_minute: "17"
sandboxd_backup_cron_hour: "2"
sandboxd_backup_retention_days: 7

# --- Node lifecycle defaults (playbooks/prepare-role-change.yml) -----------
sandboxd_role_change_drain_timeout_s: 3600

# --- Phase 4: Authenticated Mirror + Auto-Import (secret delivery only) ----
# Mirror host, upstreams, auto-import toggle / hooks_url / cluster_id, and
# retention/timeouts live in ../../../../config/cluster.yml (shared with
# Terraform). The secret VALUES (upstream wrap key, cluster PAT) live in
# ../../../../config/secrets.yml (also shared with Terraform; gitignored).
# This block only carries the Ansible-specific plumbing for landing those
# secrets on each host.
#
# These two are internal plumbing — the playbook templates them into
# SB_*_PATH env vars on each managed host. Do not override.
sandboxd_secrets_dir: /etc/sandboxd/secrets
sandboxd_upstream_wrap_key_path:       "{{ sandboxd_secrets_dir }}/upstream-wrap.key"
sandboxd_auto_import_cluster_pat_path: "{{ sandboxd_secrets_dir }}/cluster-pat"

# Optional Vault/SOPS workflow: deliver the secret from a file on the control
# node instead of inlining it in config/secrets.yml. If a *_src path is set
# AND the matching aocr.* key in config/secrets.yml is non-empty, the
# config/secrets.yml value wins (it runs first). Both empty + secrets.yml
# empty = feature off.
sandboxd_upstream_wrap_key_src: ""
sandboxd_auto_import_cluster_pat_src: ""
