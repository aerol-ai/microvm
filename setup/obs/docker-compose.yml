# Observability stack for integration-test obs nodes (Prometheus + Grafana + Pushgateway).
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - /var/lib/prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"

  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: unless-stopped
    # Persist pushed samples to a volume so a container restart at hour 3 of the
    # soak doesn't drop the accumulated per-runtime rows before Prometheus's next
    # scrape (belt-and-suspenders with the 15s scrape into the persistent TSDB).
    command:
      - --web.listen-address=0.0.0.0:9091
      - --persistence.file=/pushgateway/store
      - --persistence.interval=1m
    volumes:
      - pushgateway-data:/pushgateway
    ports:
      - "9091:9091"

  grafana-image-renderer:
    image: grafana/grafana-image-renderer:3.11.6
    restart: unless-stopped
    environment:
      - ENABLE_METRICS=true

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - grafana-image-renderer
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_RENDERING_SERVER_URL=http://grafana-image-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  grafana-data:
  pushgateway-data:
