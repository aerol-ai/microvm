groups:
  - name: sandboxd.control-plane
    interval: 30s
    rules:
      - alert: SandboxdRaftApplyErrors
        expr: sum(rate(aerolvm_raft_apply_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: raft
        annotations:
          summary: "sandboxd Raft apply errors are occurring"
          description: "Raft apply errors have been non-zero for 5 minutes. Writes may be failing or retrying."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdRaftApplyStuck
        expr: sum(aerolvm_raft_apply_inflight) > 0
        for: 2m
        labels:
          severity: critical
          component: raft
        annotations:
          summary: "sandboxd Raft apply appears stuck"
          description: "At least one Raft apply has remained in-flight for more than 2 minutes."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdRaftSnapshotErrors
        expr: sum(rate(aerolvm_raft_snapshot_errors_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          component: raft
        annotations:
          summary: "sandboxd Raft snapshot errors are occurring"
          description: "Snapshot persistence has reported errors. Follower recovery and restart time may degrade."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/backup-restore.md"

      - alert: SandboxdWorkerLeaseStale
        expr: max(aerolvm_worker_lease_max_age_nanos) / 1e9 > 30
        for: 2m
        labels:
          severity: critical
          component: scheduler
        annotations:
          summary: "sandboxd worker capacity leases are stale"
          description: "The freshest scheduler-visible worker capacity lease is older than 30 seconds. Placement may reject or misroute creates."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdWorkerLeaseLoss
        expr: sum(rate(aerolvm_worker_lease_lost_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          component: scheduler
        annotations:
          summary: "sandboxd worker capacity leases are being lost"
          description: "Workers are dropping out of the scheduler's fresh-capacity set."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

  - name: sandboxd.create-and-capacity
    interval: 30s
    rules:
      - alert: SandboxdCreateQueueBacklog
        expr: sum(aerolvm_create_queue_depth) > 100
        for: 5m
        labels:
          severity: warning
          component: create
        annotations:
          summary: "sandboxd create queue backlog is high"
          description: "Create queue depth has been above 100 for 5 minutes. Clients may see 429/503 Retry-After responses."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdCreateErrors
        expr: sum(rate(aerolvm_create_errors_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: create
        annotations:
          summary: "sandboxd create errors are elevated"
          description: "Sandbox create errors are above 0.1/s for 10 minutes."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdNoAdmitWorkers
        expr: sum(aerolvm_host_pressure_can_admit) == 0
        for: 5m
        labels:
          severity: critical
          component: capacity
        annotations:
          summary: "no sandboxd worker can admit new sandboxes"
          description: "All scraped workers report can_admit=0. New sandbox creates will fail until capacity recovers."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdHighCPUReservation
        expr: sum(aerolvm_host_pressure_reserved_cpu_millicores) / clamp_min(sum(aerolvm_host_pressure_cpu_budget_millicores), 1) > 0.9
        for: 10m
        labels:
          severity: warning
          component: capacity
        annotations:
          summary: "sandboxd CPU reservation pressure is high"
          description: "Cluster-wide reserved CPU is above 90% of the configured admission budget."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdHighMemoryReservation
        expr: sum(aerolvm_host_pressure_reserved_memory_mb) / clamp_min(sum(aerolvm_host_pressure_memory_budget_mb), 1) > 0.9
        for: 10m
        labels:
          severity: warning
          component: capacity
        annotations:
          summary: "sandboxd memory reservation pressure is high"
          description: "Cluster-wide reserved memory is above 90% of the configured admission budget."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdHighDiskReservation
        expr: sum(aerolvm_host_pressure_disk_budget_gb) > 0 and sum(aerolvm_host_pressure_reserved_disk_gb) / clamp_min(sum(aerolvm_host_pressure_disk_budget_gb), 1) > 0.9
        for: 10m
        labels:
          severity: warning
          component: capacity
        annotations:
          summary: "sandboxd disk reservation pressure is high"
          description: "Cluster-wide reserved disk is above 90% of the configured admission budget."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

  - name: sandboxd.ingress-and-data-plane
    interval: 30s
    rules:
      - alert: SandboxdIngressRouteLag
        expr: max(aerolvm_ingress_route_lag_versions) > 100
        for: 5m
        labels:
          severity: warning
          component: ingress
        annotations:
          summary: "sandboxd ingress route lag is high"
          description: "Ingress route reconciliation is more than 100 placement revisions behind."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdIngressRouteReconcileErrors
        expr: sum(rate(aerolvm_ingress_reconcile_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          component: ingress
        annotations:
          summary: "sandboxd ingress reconcile errors are occurring"
          description: "The ingress reconciler is failing to converge routes."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdCaddyAdminErrors
        expr: sum(rate(aerolvm_caddy_admin_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          component: ingress
        annotations:
          summary: "sandboxd Caddy admin errors are occurring"
          description: "Caddy admin calls are failing. Public route convergence may be delayed."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdIngressRouteMisses
        expr: sum(rate(aerolvm_ingress_route_misses_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          component: ingress
        annotations:
          summary: "sandboxd owner route misses are occurring"
          description: "Requests are reaching nodes that cannot resolve a usable owner URL. Check gossip convergence and advertise URLs."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      - alert: SandboxdOwnerForwardErrors
        expr: sum(rate(aerolvm_owner_forward_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          component: data-plane
        annotations:
          summary: "sandboxd owner-forward errors are occurring"
          description: "Cross-node owner API forwards are failing."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

  - name: sandboxd.image-pulls-and-secrets
    interval: 30s
    rules:
      - alert: SandboxdImagePullQueueBacklog
        expr: sum(aerolvm_image_pull_queued) > 0
        for: 10m
        labels:
          severity: warning
          component: image-pull
        annotations:
          summary: "sandboxd image pulls are queued"
          description: "Image pulls have been waiting behind the per-worker concurrency cap for 10 minutes."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/image-pull-storm.md"

      - alert: SandboxdImagePullBackoffRejects
        expr: sum(rate(aerolvm_image_pull_backoff_rejects_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          component: image-pull
        annotations:
          summary: "sandboxd image pulls are suppressed by failure backoff"
          description: "Repeated pulls for failing image/auth keys are being rejected by backoff. Check tags, registry auth, and registry rate limits."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/image-pull-storm.md"

      - alert: SandboxdImagePullErrors
        expr: sum(rate(aerolvm_image_pull_errors_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          component: image-pull
        annotations:
          summary: "sandboxd image pull errors are elevated"
          description: "Image pull errors are above 0.05/s for 10 minutes."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/image-pull-storm.md"

      - alert: SandboxdSecretDecryptErrors
        expr: sum(rate(aerolvm_secret_decrypt_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: secrets
        annotations:
          summary: "sandboxd secret decrypt errors are occurring"
          description: "Cluster recovery secret decrypts are failing. Verify credential encryption keys are identical on every node."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

  - name: sandboxd.custom-domains
    interval: 30s
    rules:
      # F3 — certmagic-s3 distributed lock held abnormally long. The lock is
      # taken for the duration of the ACME flow; if a node dies mid-issuance
      # the TTL drops it, but a masked partition can leave it stuck. >5m
      # held indicates either LE backoff trouble or a stuck peer.
      - alert: SandboxdACMELockStuck
        expr: max(aerolvm_acme_lock_held_seconds) > 300
        for: 2m
        labels:
          severity: warning
          component: custom-domains
        annotations:
          summary: "sandboxd ACME issuance lock held > 5 minutes"
          description: "A custom-domain ACME flow has held the certmagic-s3 lock for over 5 minutes. Issuance for the affected hostname is stalled until the lock releases."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      # F4 — the loopback ask listener can crash mid-process without taking
      # the rest of sandboxd down. New HTTPS connections then fail TLS until
      # restart. Absent asks while the process is up means the listener
      # died. 2m gives the normal SNI traffic floor enough time to register.
      - alert: SandboxdTLSAskListenerDown
        expr: sum(rate(aerolvm_ask_requests_total[2m])) == 0 and on() up{job="sandboxd"} == 1
        for: 2m
        labels:
          severity: critical
          component: custom-domains
        annotations:
          summary: "sandboxd TLS-ask listener has no traffic but process is up"
          description: "No on-demand TLS ask requests have arrived in 2 minutes while sandboxd reports healthy. The internal ask listener may have crashed; new HTTPS handshakes for custom domains will fail until restart."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

      # ACME budget burn — when the daemon-wide bucket throttles, a tenant
      # is on track to exhaust the LE account limit for the whole cluster.
      # 429s are silent at the user layer (Caddy retries); the operator
      # needs the signal to intervene.
      - alert: SandboxdACMEBudgetThrottling
        expr: sum(rate(aerolvm_ask_requests_total{key="throttled"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          component: custom-domains
        annotations:
          summary: "sandboxd is throttling ACME issuance"
          description: "The daemon-wide ACME budget is refusing new orders. Check sandboxd logs for the offending sandbox_id and investigate the misconfigured tenant."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/slo-breach.md"

  - name: sandboxd.firecracker-templates
    interval: 30s
    rules:
      # Rebuilds are kicked on first observation of a corrupt snapshot
      # (MarkSnapshotCorrupt) and re-kicked at daemon start by
      # RekickUnhealthyTemplatesAtStart, so a row should leave unhealthy
      # within FirecrackerTemplateBuildTimeout. A sustained nonzero count
      # means the rebuild path is stuck — VMM boot failing, CID allocator
      # exhausted, or the goroutine wedged. Critical because every
      # sandbox create against the affected template returns a confusing
      # "template unhealthy" error until an operator intervenes.
      - alert: SandboxdFirecrackerTemplateUnhealthy
        expr: sum(aerolvm_template_unhealthy) > 0
        for: 15m
        labels:
          severity: critical
          component: firecracker-templates
        annotations:
          summary: "Firecracker templates have been unhealthy for 15+ minutes"
          description: "At least one Firecracker rootfs template has stayed in status=unhealthy for 15 minutes. The async snapshot rebuild has either failed repeatedly or wedged. Sandbox creates against these templates will keep failing until the rebuild succeeds."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/firecracker-template-health.md"

      # Rebuild failures are counted at terminal-state transitions in
      # RebuildTemplateSnapshot. Any nonzero rate over 10m is worth
      # investigating because the rebuild path is the only way out of
      # unhealthy/ready_no_snapshot in steady state — repeated failures
      # mean a structural problem (kernel mismatch, vsock CID conflict,
      # rootfs corruption) rather than transient flakiness.
      - alert: SandboxdFirecrackerTemplateRebuildErrors
        expr: sum(rate(aerolvm_template_rebuild_failed_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          component: firecracker-templates
        annotations:
          summary: "Firecracker template rebuild errors are occurring"
          description: "Snapshot rebuilds have been failing for 10 minutes. Templates that hit this path flip to ready_no_snapshot — cold boot still works but the fast-boot property is gone until the underlying cause is fixed."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/firecracker-template-health.md"

      # The push reconciler ticks at SnapshotPushReconcileInterval
      # (default seconds), so a row should leave pending within minutes
      # of being written. A sustained pending count means the reconciler
      # is wedged or the registry is unreachable from this node —
      # cluster peers can't pull artifacts they don't have local copies
      # of, so the consumer-side puller will block sandbox creates on
      # remote template references.
      - alert: SandboxdFirecrackerTemplatePushStalled
        expr: sum(aerolvm_template_push_pending) > 0
        for: 30m
        labels:
          severity: warning
          component: firecracker-templates
        annotations:
          summary: "Firecracker template artifact push has stalled"
          description: "At least one template has been waiting for AOCR push for 30 minutes. Cluster peers cannot replicate the artifacts until push completes — sandbox creates against this template on other nodes will block on a cold fetch."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/firecracker-template-health.md"

      # Templates in push_state=error stay there until the reconciler
      # retries successfully or an operator clears them. A sustained
      # nonzero gauge means structural breakage (bad registry creds,
      # network partition, registry rejecting the artifact size) rather
      # than transient flakiness — the reconciler has already retried
      # multiple times by the time the row settles into error.
      - alert: SandboxdFirecrackerTemplatePushErrored
        expr: sum(aerolvm_template_push_error) > 0
        for: 15m
        labels:
          severity: warning
          component: firecracker-templates
        annotations:
          summary: "Firecracker template artifact push is erroring"
          description: "At least one template has been in push_state=error for 15 minutes. The reconciler has already retried and given up; check registry credentials, network reachability to the AOCR endpoint, and template artifact sizes."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/firecracker-template-health.md"

      # Pull failures land on the consumer side of cluster replication —
      # a node that needs a remote template's artifacts cannot retrieve
      # them. Sandbox creates against affected templates block on the
      # boot path while EnsureTemplateLocal keeps retrying. Even a low
      # rate (>0/s for 5m) is operator-actionable because the failure
      # is sticky: the underlying cause (auth, network, registry
      # garbage-collected the artifact) won't fix itself.
      - alert: SandboxdFirecrackerTemplatePullErrors
        expr: sum(rate(aerolvm_template_pull_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          component: firecracker-templates
        annotations:
          summary: "Firecracker template artifact pulls are failing"
          description: "Peer-side template fetches have been failing for 5 minutes. Sandbox creates that resolve to a remote-built template will block on the pull retry on the affected nodes until the pull path recovers."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/firecracker-template-health.md"

  - name: sandboxd.secrets-audit
    interval: 30s
    rules:
      # The writer failed to initialize or encountered persistent I/O errors.
      - alert: SandboxdSecretAuditSinkUnavailable
        expr: aerolvm_secret_audit_sink_healthy == 0
        for: 1m
        labels:
          severity: critical
          component: secrets-audit
        annotations:
          summary: "sandboxd secret audit sink is unavailable"
          description: "The local evidence writer is unavailable. Strict-boot nodes refuse startup; an explicitly non-strict node counts every attempted event as dropped until recovery."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/secrets-and-audit.md"

      # Buffer overflow on the async audit writer. Gap markers are written so
      # the JSONL stays honest, but dropped events are gone on that node.
      - alert: SandboxdAuditEventsDropped
        expr: increase(aerolvm_audit_events_dropped_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          component: secrets-audit
        annotations:
          summary: "sandboxd secret audit events are being dropped"
          description: "aerolvm_audit_events_dropped_total increased in the last 5 minutes. The local audit stream has gap markers; history on this node is incomplete."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/secrets-and-audit.md"

      # Async sealed-blob peer push/delete failures. Creates do not wait on
      # fan-out; failover_ready stays false until copies land.
      - alert: SandboxdSecretFanoutFailures
        expr: increase(aerolvm_secret_fanout_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: secrets-audit
        annotations:
          summary: "sandboxd secret peer fan-out is failing"
          description: "aerolvm_secret_fanout_failures_total increased in the last 10 minutes. HA sandboxes may remain failover_ready=false; check peer health and credentials."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/secrets-and-audit.md"

      - alert: SandboxdSecretDeleteOutboxStalled
        expr: aerolvm_secret_delete_outbox_pending > 0 and aerolvm_secret_delete_outbox_oldest_age_seconds > 900
        for: 5m
        labels:
          severity: warning
          component: secrets-audit
        annotations:
          summary: "sandboxd secret-delete reconciliation is stalled"
          description: "At least one durable peer-delete job has remained pending for more than 15 minutes. Deleted credentials may still exist on an unavailable recipient."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/secrets-and-audit.md"

      - alert: SandboxdSecretDeleteOutboxBacklogHigh
        expr: aerolvm_secret_delete_outbox_pending > 10000
        for: 10m
        labels:
          severity: warning
          component: secrets-audit
        annotations:
          summary: "sandboxd secret-delete backlog is high"
          description: "More than 10,000 durable peer-delete jobs are pending on this node. Check recipient reachability before the backlog threatens retention objectives."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/secrets-and-audit.md"

      - alert: SandboxdSecretPutOutboxBacklogHigh
        expr: aerolvm_secret_put_outbox_pending > 10000
        for: 10m
        labels:
          severity: warning
          component: secrets-audit
        annotations:
          summary: "sandboxd secret-put backlog is high"
          description: "More than 10,000 durable secret PUT deliveries are pending. HA sandboxes may remain failover_ready=false until recipients recover."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/secrets-and-audit.md"

      - alert: SandboxdSecretPutOutboxFailures
        expr: increase(aerolvm_secret_put_outbox_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: secrets-audit
        annotations:
          summary: "sandboxd secret-put reconciliation is failing"
          description: "The durable secret PUT outbox reported failures. Check SQLite health, mTLS identity, and recipient reachability."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/secrets-and-audit.md"

      - alert: SandboxdSecretAuditExportFailing
        expr: increase(aerolvm_secret_audit_export_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
          component: secrets-audit
        annotations:
          summary: "sandboxd off-node audit export is failing"
          description: "Audit batches are not reaching the configured off-node receiver. Local evidence continues to grow but disk loss can exceed the recovery objective."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/secrets-and-audit.md"

      - alert: SandboxdClusterCertExpiring
        expr: ((aerolvm_cluster_mtls_cert_not_after_unix - time()) < 1209600 and aerolvm_cluster_mtls_cert_not_after_unix > time()) or ((aerolvm_cluster_mtls_ca_not_after_unix - time()) < 2592000 and aerolvm_cluster_mtls_ca_not_after_unix > time())
        for: 5m
        labels:
          severity: warning
          component: cluster-mtls
        annotations:
          summary: "sandboxd cluster mTLS certificate is nearing expiry"
          description: "A node leaf has less than 14 days or the cluster CA less than 30 days remaining. Rotate node.crt/node.key atomically; new handshakes hot-reload the pair."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/secrets-and-audit.md"

      # Provider boot/runtime canary (local always ok; awskms wrap/unwrap).
      - alert: SandboxdSecretProviderCanaryFailing
        expr: aerolvm_secret_provider_canary_ok == 0
        for: 10m
        labels:
          severity: warning
          component: secrets-audit
        annotations:
          summary: "sandboxd secret provider canary is failing"
          description: "aerolvm_secret_provider_canary_ok has been 0 for 10 minutes. New wraps/opens may fail; for awskms check IAM/KMS reachability."
          runbook_url: "https://github.com/aerol-ai/microvm/blob/main/setup/runbooks/secrets-and-audit.md"
