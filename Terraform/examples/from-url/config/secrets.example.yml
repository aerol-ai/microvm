# Copy to secrets.yml (next to this file) and fill in. Never commit
# secrets.yml: it holds the cluster's admin token.

cluster:
  # The admin token (PAT) every node shares. Make one with:
  #   openssl rand -hex 32
  pat_token: ""
  # Optional read-only token for Prometheus. Empty scrapes with the PAT.
  metrics_token: ""

cloudflare:
  # Zone:DNS:Edit on the zone of ingress.domain_name (add Zone:Read to let
  # the module find the zone by name). Also used for the TLS certificate.
  api_token: ""

# Only needed with mirror.host or auto_import.enabled in cluster.yml.
aocr:
  upstream_wrap_key: ""
  cluster_pat: ""

# Only needed with fleet_control_plane.enabled in cluster.yml.
fleet:
  token: ""
