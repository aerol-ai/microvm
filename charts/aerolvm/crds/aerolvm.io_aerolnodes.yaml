---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: aerolnodes.aerolvm.io
spec:
  group: aerolvm.io
  names:
    kind: AerolNode
    listKind: AerolNodeList
    plural: aerolnodes
    shortNames:
    - an
    singular: aerolnode
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .status.sandboxes
      name: Sandboxes
      type: integer
    - jsonPath: .status.freeCPU
      name: Free CPU
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AerolNode is one server, gateway or worker. Only the operator
          writes it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AerolNodeSpec says what the node is. The operator writes
              it once.
            properties:
              cluster:
                description: Cluster is the AerolCluster's name.
                type: string
              pool:
                description: Pool is the worker pool, for workers.
                type: string
              role:
                enum:
                - server
                - gateway
                - worker
                type: string
              zone:
                description: Zone is where the operator pins the pod (§11).
                type: string
            required:
            - cluster
            - role
            - zone
            type: object
          status:
            description: |-
              AerolNodeStatus is what the operator saw last. Counters are written at
              most once a minute (G4).
            properties:
              agentImage:
                description: |-
                  AgentImage is the agent container's image the operator last set,
                  and AgentImageID the image ID the kubelet reported for it: a swap is
                  confirmed only when the ID changes (eng review SC-1).
                type: string
              agentImageID:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              decommission:
                description: DecommissionStatus is a worker's decommission so far
                  (C9).
                properties:
                  deadline:
                    description: Deadline is when what could not move is stopped.
                    format: date-time
                    type: string
                  drainUntil:
                    description: DrainUntil ends the drain window; the moves start
                      then.
                    format: date-time
                    type: string
                  moved:
                    description: Moved counts the sandboxes moved to other workers.
                    format: int32
                    type: integer
                  nodeDeleted:
                    description: NodeDeleted is set once the node left the AerolVM
                      cluster.
                    type: boolean
                  remaining:
                    description: Remaining counts the sandboxes still placed on the
                      node.
                    format: int32
                    type: integer
                  startedAt:
                    format: date-time
                    type: string
                required:
                - deadline
                - drainUntil
                - moved
                - remaining
                - startedAt
                type: object
              freeCPU:
                description: FreeCPU and FreeMemory are its room for new sandboxes.
                type: string
              freeMemory:
                type: string
              lastUpdated:
                description: LastUpdated is when the counters were last written.
                format: date-time
                type: string
              nodeName:
                description: NodeName is the Kubernetes Node the pod runs on.
                type: string
              podName:
                description: PodName is the node's pod.
                type: string
              reason:
                description: Reason explains the state, such as why a worker never
                  became ready.
                type: string
              sandboxes:
                description: Sandboxes is how many sandboxes run on it.
                format: int32
                type: integer
              state:
                type: string
              version:
                description: Version is the sandboxd build the node reports.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
