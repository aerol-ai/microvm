apiVersion: v1
kind: Service
metadata:
  name: {{ include "aerolvm.name" . }}
  labels:
    {{- include "aerolvm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aerolvm.selector" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
