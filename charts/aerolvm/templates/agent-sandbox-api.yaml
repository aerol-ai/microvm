{{- if and (eq .Values.mode "cluster") .Values.cluster.agentSandboxAPI.enabled }}
{{- $name := .Values.cluster.name }}
{{- $ns := .Release.Namespace }}
{{- $svc := printf "%s-agent-sandbox-api" $name }}
# The Kubernetes agent-sandbox API (plans/kubernetes-v2-architecture.md §16,
# C17): the gateways serve agents.x-k8s.io/v1beta1 through an APIService, so
# nothing is stored in etcd per sandbox. The gateways get exactly two
# Kubernetes rights: ask who may do what (SubjectAccessReview, through
# system:auth-delegator) and read the front-proxy CA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-gateway
  labels:
    {{- include "aerolvm.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-gateway-auth-delegator
  labels:
    {{- include "aerolvm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - { kind: ServiceAccount, name: {{ $name }}-gateway, namespace: {{ $ns }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-gateway-auth-reader
  namespace: kube-system
  labels:
    {{- include "aerolvm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - { kind: ServiceAccount, name: {{ $name }}-gateway, namespace: {{ $ns }} }
---
# The APIService's backend: every gateway's API listener.
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  labels:
    {{- include "aerolvm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aerolvm
    app.kubernetes.io/component: gateway
    aerolvm.io/cluster: {{ $name }}
  ports:
    - { name: https, port: 443, targetPort: agent-sandbox }
---
# Its serving certificate, from a self-signed CA cert-manager also injects
# into the APIService, so the kube-apiserver trusts exactly this one.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $svc }}-selfsigned
  labels:
    {{- include "aerolvm.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $svc }}
  labels:
    {{- include "aerolvm.labels" . | nindent 4 }}
spec:
  secretName: {{ $svc }}-tls
  dnsNames:
    - {{ $svc }}.{{ $ns }}.svc
    - {{ $svc }}.{{ $ns }}.svc.cluster.local
  issuerRef: { kind: Issuer, name: {{ $svc }}-selfsigned }
  duration: 8760h
  renewBefore: 720h
---
{{- range $group := list "agents.x-k8s.io" "extensions.agents.x-k8s.io" }}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.{{ $group }}
  labels:
    {{- include "aerolvm.labels" $ | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $ns }}/{{ $svc }}
spec:
  group: {{ $group }}
  version: v1beta1
  service: { name: {{ $svc }}, namespace: {{ $ns }}, port: 443 }
  groupPriorityMinimum: 1000
  versionPriority: 15
{{- end }}
# Templates and warm pools live in etcd as AerolVM's own CRDs (decision
# C17): they change rarely. The gateways are their only writer, and these
# two kinds are the only thing they may write. Claims and sandboxes are
# never stored in etcd. Helm keeps the CRDs when the API is turned off:
# deleting a CRD deletes every object of its kind, so turning the API off
# and on again would otherwise lose every template and warm pool.
{{- range $kind := list "SandboxTemplate" "SandboxWarmPool" }}
{{- $plural := printf "%ss" (lower $kind) }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: {{ $plural }}.k8s.aerolvm.io
  labels:
    {{- include "aerolvm.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: k8s.aerolvm.io
  scope: Namespaced
  names: { plural: {{ $plural }}, singular: {{ lower $kind }}, kind: {{ $kind }}, listKind: {{ $kind }}List }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-gateway-store
  labels:
    {{- include "aerolvm.labels" . | nindent 4 }}
rules:
  - apiGroups: ["k8s.aerolvm.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-gateway-store
  labels:
    {{- include "aerolvm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-gateway-store
subjects:
  - { kind: ServiceAccount, name: {{ $name }}-gateway, namespace: {{ $ns }} }
{{- end }}
