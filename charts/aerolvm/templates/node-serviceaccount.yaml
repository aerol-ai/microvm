{{- $sa := ((.Values.audit | default dict).credentials | default dict).serviceAccount | default dict }}
{{- if $sa.create }}
{{- /* The nodes' service account (audit.credentials.serviceAccount): how
each node signs in to the audit store with IRSA. It is
bound to no Kubernetes role, and node pods never mount its API token. In
each namespace a node runs in. */}}
{{- $namespaces := list .Release.Namespace }}
{{- if and (eq .Values.mode "cluster") (ne .Values.cluster.workerNamespace .Release.Namespace) }}
{{- $namespaces = append $namespaces .Values.cluster.workerNamespace }}
{{- end }}
{{- range $i, $ns := $namespaces }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aerolvm.nodeServiceAccount" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "aerolvm.labels" $ | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
