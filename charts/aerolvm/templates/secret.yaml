{{- if not .Values.apiToken.existingSecret }}
{{- $name := include "aerolvm.tokenSecret" . }}
{{- /* Keep the token across upgrades: a new one would lock every client out. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "aerolvm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $old $old.data (index $old.data "SB_PAT_TOKEN") }}
  SB_PAT_TOKEN: {{ index $old.data "SB_PAT_TOKEN" }}
  {{- else }}
  SB_PAT_TOKEN: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
