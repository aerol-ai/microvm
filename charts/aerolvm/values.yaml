# AerolVM on Kubernetes (plans/kubernetes-v2-architecture.md, P3).
#
# mode: single runs AerolVM in one pod with no operator: a worker pod whose
# runtime container holds containerd and every sandbox, and whose agent
# container is sandboxd. For kind, laptops and small installs. Cluster mode
# (gateways, servers and an operator) comes with the operator in Phase 2.
mode: single

image:
  registry: ghcr.io/aerol-ai
  # Empty: the chart's appVersion. Use a digest-pinned tag in production.
  tag: ""
  pullPolicy: IfNotPresent

# The API token every client sends (Authorization: Bearer). Empty makes one
# on first install and keeps it across upgrades; or name a Secret you made,
# with the token under the key SB_PAT_TOKEN.
apiToken:
  existingSecret: ""

worker:
  # The runtime container's budget is the sandboxes' budget: every sandbox
  # runs in its cgroup (C7), capped below this limit with a reserve kept for
  # containerd and the supervisor. Keep requests equal to limits (Guaranteed),
  # so the kubelet never evicts the pod first under memory pressure (S3).
  runtime:
    resources:
      requests: { cpu: "2", memory: 4Gi }
      limits: { cpu: "2", memory: 4Gi }
  agent:
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: 500m, memory: 1Gi }
  egress:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 100m, memory: 128Mi }

  # Sandbox settings; each becomes an SB_* variable for sandboxd.
  # defaultRuntime: the isolation a create gets when it names none
  # ("docker" = runc, or "gvisor").
  defaultRuntime: ""
  # Refuse new sandboxes while the sandbox volume has less than this share
  # free (C27). "0" turns it off.
  diskFloorRatio: "0.10"
  # Sandboxes cannot reach private addresses unless a create allows them
  # (C24): a bank's network is not one connection away.
  blockPrivateByDefault: true
  # Per-team usage on the agent's /v1/metrics (C20): each owner's reserved
  # CPU and memory over time (the charge) and its measured use (shown,
  # never billed). The worker pod asks for a whole machine, so a cost tool
  # sees one big pod; Prometheus sums these by owner, and the cost tool
  # splits the pod's cost by those shares. Nothing is sent anywhere: the
  # numbers leave the pod only when Prometheus scrapes it. Owner names
  # become label values; set false to keep them off /v1/metrics.
  usageMetrics:
    enabled: true
  # The cluster's own addresses (C24). Each entry is an address or a CIDR.
  # In cluster mode the operator fills these in (Phase 2); in single mode
  # you set them. Empty by default because the chart cannot know them.
  #
  # egressDenyFloor: addresses no sandbox can ever reach, whatever its
  # egress profile says. Put the Kubernetes API server here: its Service
  # address (kubectl get svc kubernetes -n default) and the addresses behind
  # it (kubectl get endpointslices -n default -l
  # kubernetes.io/service-name=kubernetes). Never the DNS Service address:
  # sandboxes would lose DNS.
  egressDenyFloor: []
  # egressPrivateRanges: the cluster's pod, Service and node ranges.
  # Sandboxes cannot reach them by default, like the private ranges, and an
  # egress profile can open one on purpose. List them even when they sit
  # inside 10.0.0.0/8: the NetworkPolicy below leaves them out too, and a
  # range outside the private ranges (EKS custom networking uses
  # 100.64.0.0/10 for pods, for example) needs it. Needs
  # blockPrivateByDefault: true.
  egressPrivateRanges: []
  # Any other sandboxd setting, as SB_NAME: value.
  extraEnv: {}

  # containerd's images and every sandbox's writable layer. An emptyDir is
  # lost with the pod; production uses a local PersistentVolume or a host
  # path on the machine's NVMe, and an XFS volume with prjquota allows a
  # per-sandbox disk limit (SB_CONTAINERD_DISK_QUOTA, C27).
  containerdVolume:
    emptyDir: {}
  # sandboxd's database.
  stateVolume:
    emptyDir: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 21212

# An egress NetworkPolicy for the worker pod (C24): the second wall around
# sandboxes, after AerolVM's own firewall inside the pod. Sandbox traffic
# leaves with the pod's address, so this limits the whole pod: it may reach
# the other AerolVM pods of this install, the cluster DNS, and the internet
# without the private ranges (10/8, 172.16/12, 192.168/16, 100.64/10,
# 169.254/16) and without worker.egressPrivateRanges and
# worker.egressDenyFloor.
#
# On by default, because the chart's default is to keep sandboxes off the
# bank's network (CEO review RQ14). A cluster whose network plugin does not
# enforce NetworkPolicy ignores it. Turn it off only if your own policy
# already limits the pod.
networkPolicy:
  enabled: true
  # Where the cluster DNS runs; its pods get port 53.
  dns:
    namespace: kube-system
    podLabels: { k8s-app: kube-dns }
  # Ranges the pod may reach on purpose. Two kinds go here:
  #  - the one internal range a bank opens to sandboxes. Open it in AerolVM
  #    too, with an egress profile, or sandboxes still cannot reach it;
  #  - private addresses the pod itself needs: a private registry for
  #    sandbox images, VPC endpoints for object storage or KMS, or the
  #    NodeLocal DNSCache address (often 169.254.20.10/32).
  extraEgressCIDRs: []

# Sandbox links and the API over HTTPS (C25): an edge container runs
# AerolVM's Caddy, as on a domain install. The API is https://<domain> and
# a sandbox's port is https://<id>-<port>.<domain>. The certificate comes
# from cert-manager (a chart prerequisite when this is on): point
# certManager.issuerRef at your issuer, or name a kubernetes.io/tls Secret
# you keep yourself. No pod holds a DNS provider token. Point the domain and
# its wildcard at edge.service.
edge:
  enabled: false
  domain: ""
  certManager:
    # For example { name: letsencrypt-dns, kind: ClusterIssuer }.
    issuerRef: {}
  # A Secret with tls.crt and tls.key for <domain> and *.<domain>, instead
  # of a cert-manager Certificate.
  existingTLSSecret: ""
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 250m, memory: 256Mi }
  service:
    type: LoadBalancer
