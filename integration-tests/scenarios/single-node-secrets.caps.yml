# S1 capabilities. A missing capability means ⚪ skip, never a red — the
# matrix uses these to decide which use cases are APPLICABLE here.
name: single-node-secrets
capabilities:
  - docker
  - platform-volumes
  - domain
  # The secret/audit cases are meaningful: the provider is real (local), the
  # sealed-env path is live, and the audit chain is being written.
  - secrets
  # An off-node sink is NOT configured (file is on-node), so audit-export is
  # deliberately absent — the export use cases skip rather than assert against
  # a sink the suite cannot read back over HTTP.
#
# Not disruptive: a single node has nothing to fail over TO, so the D-tagged
# cases would be meaningless here rather than merely slow.
disruptive: false
