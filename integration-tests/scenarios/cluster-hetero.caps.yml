# Heterogeneous 8-node cluster: dedicated server/ingress/worker roles with
# docker, gVisor, WASM, and Firecracker (x86 bare metal) workers.
name: cluster-hetero
capabilities:
  - docker
  - platform-volumes
  - firecracker
  - gvisor
  - wasm
  - domain
  - cluster
  # Opt the create-benchmark UCs (UC-94/UC-95) in on this scenario only: it is
  # the one cluster carrying every runtime, so a per-runtime create-latency +
  # density benchmark is meaningful here. The benchmark is slow and provisions
  # many sandboxes, so no other scenario advertises it.
  - benchmark

expected_members: 8
