name: cluster-3-mixed-secrets-enterprise
capabilities:
  - docker
  - platform-volumes
  - domain
  - cluster
  - secrets
  - secrets-kms
  - cluster-mtls
  - audit-export
  # The scenario has an external witness: the S3 Object Lock bucket from
  # audit_witness_enabled in the tfvars, written by the stock daemon and read
  # back by the suite (UC-143, UC-144, UC-263). integration-tests/safety
  # refuses this capability without that bucket, so a scenario cannot claim
  # a witness it does not have.
  - audit-witness
  # SB_ENTERPRISE_MODE=true. Used mostly in Excludes: a case that asserts a
  # non-enterprise behaviour lists this and is skipped here, because a
  # positive "non-enterprise" capability would fail OPEN on every scenario
  # that simply forgot to declare it.
  - enterprise
  # Identity and access (T12). Enterprise mode requires identity on and the
  # host-scoped PAT (T10), so the suite drives these nodes with an admin avm_
  # token run.sh mints on the seed.
  - identity
  - pat-scope-host
  # The test issuer, installed by the suite at SB_IDENTITY_FILE.
  - identity-oidc
  # install.sh --l4-proxy-protocol (T10): UC-288.
  - l4-proxy-protocol
  # SB_PAT_TOKEN_PREVIOUS rotation across the cluster (T10): UC-277.
  - pat-rotation
  # D6: the only scenario that provisions isolate + its jail.
  - isolate
  - isolate-jail
disruptive: true

# Raft/gossip member count. Without this run.sh SKIPS wait_for_members and the
# suite starts against a cluster that has not converged, so the cluster cases
# fail for a reason that has nothing to do with what they test.
expected_members: 3
