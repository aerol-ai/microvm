name: cluster-hetero-lite-routing
capabilities:
  - docker
  - platform-volumes
  - domain
  - cluster
  - secrets
  - cluster-mtls
  - audit-export
  # Enterprise is on, so the S3 Object Lock witness is too
  # (audit_witness_enabled in the tfvars; the stock daemon writes to it).
  - audit-witness
  - enterprise
  # Identity and access (T12). Enterprise mode requires identity on and the
  # host-scoped PAT (T10), so the suite drives these nodes with an admin avm_
  # token run.sh mints on the seed.
  - identity
  - pat-scope-host
  - gvisor
  - ingress-proxy-routing
#
# Role separation is the whole point of this topology: killing a worker
# must not take the control plane with it, which is only testable here.
disruptive: true

# Raft/gossip member count: 3 server + 1 ingress + 4 worker (worker-z is a
# t3.medium here, not a c5.metal — hence no firecracker capability).
expected_members: 8
