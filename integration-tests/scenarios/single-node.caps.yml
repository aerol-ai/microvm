# Capabilities the single-node scenario can satisfy. The suite skips any use
# case whose required capabilities aren't all present here.
name: single-node
capabilities:
  - docker
  - domain
  # custom-domains gates UC-35/36. single-node.tfvars sets
  # enable_custom_domains=true, and the Terraform bootstrap injects
  # SB_ENABLE_CUSTOM_DOMAINS into the daemon env, so the feature is live here.
  - custom-domains
