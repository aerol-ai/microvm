# Capabilities for the single-node containerd-engine soak scenario
# (plans/containerd-engine.md Phase 5 / §8). containerd is the harness default
# engine now, so this scenario would run containerd regardless; the
# containerd-engine cap is what OPTS IN the containerd-specific soak UCs
# (UC-99..102) — it no longer selects the engine.
name: single-node-containerd
capabilities:
  - docker
  - containerd-engine
  - platform-volumes
  - domain
  - custom-domains
  # Hostname egress filtering (plans/egress-domain-filtering.md P1-10): install.sh
  # starts the aerolvm-egress-gateway units and SB_EGRESS_FQDN_ENABLED defaults
  # on, so UC-180..182 run here.
  - egress-fqdn
