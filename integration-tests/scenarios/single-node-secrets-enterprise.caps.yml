# One server in enterprise mode, witnessed by an S3 Object Lock bucket
# (plans/open-audit-witness.md, Phase 4). The tfvars twin says why each piece
# is there; this file says which use cases that makes meaningful.
name: single-node-secrets-enterprise
capabilities:
  - docker
  - platform-volumes
  - domain
  - secrets
  # The receiver is the off-node https sink enterprise requires, and the suite
  # can read it back.
  - audit-export
  # The scenario has an external witness: the Object Lock bucket from
  # audit_witness_enabled, written by the stock daemon and read back by the
  # suite (UC-143, UC-144, UC-263).
  - audit-witness
  # SB_ENTERPRISE_MODE=true. Used mostly in Excludes: a case that asserts a
  # non-enterprise behaviour lists this and is skipped here.
  - enterprise
  # Identity and access (T12). Enterprise mode requires identity on and the
  # host-scoped PAT (T10), so the suite drives these nodes with an admin avm_
  # token run.sh mints on the seed.
  - identity
  - pat-scope-host
  # The test issuer, installed by the suite at SB_IDENTITY_FILE.
  - identity-oidc
  # install.sh --l4-proxy-protocol (T10): UC-288.
  - l4-proxy-protocol
#
# Disruptive, unlike single-node-secrets: the witness, tamper and enterprise
# boot gates (UC-144, UC-264, UC-265, UC-156, UC-158, UC-159) refuse the only
# node's boot on purpose, and always put it back. Every failover case requires
# the cluster capability, so it skips here instead of hunting for a node to
# fail over to.
disruptive: true
