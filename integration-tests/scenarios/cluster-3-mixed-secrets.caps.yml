name: cluster-3-mixed-secrets
capabilities:
  - docker
  - platform-volumes
  - domain
  - cluster
  - secrets
  # Every node holds a CA-signed cert carrying DNS:node:<id>, minted by the
  # seed's CSR signing rendezvous. There is no escape hatch on this path.
  - cluster-mtls
  # An off-node exporter IS configured and its sink is readable, so the export
  # use cases can assert on delivered records rather than on intent.
  - audit-export
#
# Node-kill / failover fault injection. This is the scenario that must prove
# UC-117, so it MUST be true — with it false the D-tagged cases would report a
# clean ⚪ skip and the gate would go green having tested none of them.
disruptive: true
