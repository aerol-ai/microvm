name: cluster-hetero-secrets-kms
capabilities:
  - docker
  - platform-volumes
  - domain
  - cluster
  - secrets
  - secrets-kms
  - cluster-mtls
  - audit-export
  # Enterprise is on, so the -tags itestwitness daemon is required.
  - audit-witness
  - enterprise
  - gvisor
  - firecracker
#
# Role separation is the whole point of this topology: killing a worker
# must not take the control plane with it, which is only testable here.
disruptive: true
