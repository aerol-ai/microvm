name: cluster-3-mixed-secrets-kms
capabilities:
  - docker
  - platform-volumes
  - domain
  - cluster
  - secrets
  # SB_SECRET_PROVIDER=awskms against a real key. Cases that assert the
  # RECIPIENT-SET boundary must exclude this capability: under awskms that
  # boundary does not exist, so they would be vacuous greens or false reds.
  - secrets-kms
  - cluster-mtls
  - audit-export
disruptive: true

# Raft/gossip member count. Without this run.sh SKIPS wait_for_members and the
# suite starts against a cluster that has not converged, so the cluster cases
# fail for a reason that has nothing to do with what they test.
expected_members: 3
