# H0 worker pod: one privileged pod on the tainted worker node, running our
# own containerd and a single-node sandboxd (plans/kubernetes-v2-phase0.md).
# The ConfigMap worker-boot (fetch.sh, run.sh) and the Secret worker-urls
# (presigned build URLs and the API token) are made by h0.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: aerolvm-workers
  labels:
    # Only this namespace allows privileged pods (plan §8.7, wall 2).
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Pod
metadata:
  name: worker-0
  namespace: aerolvm-workers
  labels:
    app: aerolvm-worker
spec:
  nodeSelector:
    aerolvm.io/pool: phase0
  tolerations:
    - key: aerolvm.io/worker
      operator: Equal
      value: "true"
      effect: NoSchedule
  # A spike wants to see a crash, not have it hidden by a restart.
  restartPolicy: Never
  # No Kubernetes API rights for the worker (plan §8.7, wall 4).
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 30
  initContainers:
    - name: fetch
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["bash", "/boot/fetch.sh"]
      # Init containers count toward the pod's QoS class: without request
      # equal to limit here, the pod is Burstable, not Guaranteed. dnf needs
      # more than 512Mi to load its metadata (it was OOM-killed at 512Mi).
      resources:
        requests: { cpu: "1", memory: 1536Mi }
        limits: { cpu: "1", memory: 1536Mi }
      envFrom:
        - secretRef:
            name: worker-urls
      volumeMounts:
        - { name: bin, mountPath: /opt/aerolvm }
        - { name: boot, mountPath: /boot }
  containers:
    - name: worker
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["bash", "/boot/run.sh"]
      securityContext:
        privileged: true
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SB_PAT_TOKEN
          valueFrom:
            secretKeyRef:
              name: worker-urls
              key: SB_PAT_TOKEN
        # "1" turns on the C7 cgroup placement in run.sh (spike S1).
        - name: AEROL_C7_CGROUP_PARENT
          valueFrom:
            secretKeyRef:
              name: worker-urls
              key: AEROL_C7_CGROUP_PARENT
              optional: true
      ports:
        - { name: api, containerPort: 21212 }
      # Ready only once sandboxd listens. Not /health: it reports "degraded"
      # with 200 here, because it pings Docker (plan C2). No liveness probe:
      # a failed probe would restart the container and kill every sandbox
      # (plan §8.2).
      readinessProbe:
        tcpSocket: { port: api }
        periodSeconds: 2
        failureThreshold: 1
      # Request equals limit: the Guaranteed class (plan §8.1). Sized under an
      # m7i.xlarge's allocatable, leaving room for the node's own add-ons.
      resources:
        requests: { cpu: "3", memory: 12Gi }
        limits: { cpu: "3", memory: 12Gi }
      volumeMounts:
        - { name: bin, mountPath: /opt/aerolvm }
        - { name: boot, mountPath: /boot }
        # On the machine's disk: overlayfs snapshots cannot live on the
        # container's own overlay root.
        - { name: containerd, mountPath: /var/lib/containerd }
        - { name: aerolvm, mountPath: /var/lib/aerolvm }
        - { name: sandboxd, mountPath: /var/lib/sandboxd }
  volumes:
    - { name: bin, emptyDir: {} }
    - name: boot
      configMap:
        name: worker-boot
        defaultMode: 0755
    - { name: containerd, emptyDir: {} }
    - { name: aerolvm, emptyDir: {} }
    - { name: sandboxd, emptyDir: {} }
