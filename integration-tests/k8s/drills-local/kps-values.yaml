# kube-prometheus-stack for the local drills (drills-local.sh), as small as
# a kind cluster on a laptop allows: Prometheus, Alertmanager, the operator
# and kube-state-metrics (the chart's pod alerts read it). No Grafana, node
# exporter or Kubernetes' own rules: the drills watch AerolVM's alerts only.
#
# Alertmanager's routing is setup/alertmanager/sandboxd-alertmanager-example.yml
# as shipped (same tree, timers and inhibit rule), with the two webhook URLs
# pointed at the echo receiver drills-local.sh runs.
defaultRules:
  create: false
grafana:
  enabled: false
nodeExporter:
  enabled: false
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }
coreDns: { enabled: false }
kubeApiServer: { enabled: false }
kubelet: { enabled: false }

prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 1d
    # The cluster label the example's group_by and inhibit rule use.
    externalLabels: { cluster: aerolvm-drills }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
  config:
    route:
      receiver: sandboxd-platform
      group_by: [alertname, cluster, component]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: ['severity="critical"']
          receiver: sandboxd-platform-critical
          repeat_interval: 30m
    receivers:
      - name: sandboxd-platform
        webhook_configs:
          - url: http://alert-echo.monitoring.svc:8080/sandboxd
            send_resolved: true
      - name: sandboxd-platform-critical
        webhook_configs:
          - url: http://alert-echo.monitoring.svc:8080/sandboxd-critical
            send_resolved: true
    inhibit_rules:
      - source_matchers: ['alertname="SandboxdWorkerLeaseStale"']
        target_matchers: ['alertname="SandboxdCreateQueueBacklog"']
        equal: [cluster]

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
