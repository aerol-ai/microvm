# The worker machines of the bank run (eks-bank.sh install), as
# charts/aerolvm/values-bank-eks.yaml asks a bank to make them: Karpenter,
# expireAfter Never and no terminationGracePeriod (the operator replaces
# machines by age, moving sandboxes first), instance metadata unreachable
# from pods (httpTokens required, hop limit 1), br_netfilter loaded at boot,
# the pool's label and taint. Placeholders in @@...@@ are filled by
# eks-bank.sh.
#
# Cost guards: every machine, its disk and its network interface carry the
# run's aerol:* tags, which the teardown Lambda and reap.sh find; the
# NodePool's CPU limit caps the machines Karpenter may buy (eks-bank.sh
# raises it only inside the 60-worker time box); WhenEmpty consolidation
# ends a machine the operator emptied, and never moves a worker pod.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata: { name: bank-workers }
spec:
  role: "@@ROLE@@"
  amiSelectorTerms: [{ alias: al2023@latest }]
  subnetSelectorTerms: [{ tags: { karpenter.sh/discovery: "@@NAME@@" } }]
  securityGroupSelectorTerms: [{ tags: { aws:eks:cluster-name: "@@NAME@@" } }]
  metadataOptions: { httpEndpoint: enabled, httpTokens: required, httpPutResponseHopLimit: 1 }
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: { volumeSize: 60Gi, volumeType: gp3, deleteOnTermination: true }
  tags: { aerol:purpose: k8s-phase0, aerol:owner: itest, aerol:ttl: "@@TTL@@", aerol:run: "@@NAME@@" }
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    echo br_netfilter > /etc/modules-load.d/aerolvm.conf
    modprobe br_netfilter
    --//--
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: { name: gvisor-general }
spec:
  template:
    metadata:
      labels: { aerolvm.io/pool: gvisor-general }
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: bank-workers }
      taints: [{ key: aerolvm.io/pool, value: gvisor-general, effect: NoSchedule }]
      expireAfter: Never
      requirements:
        - { key: node.kubernetes.io/instance-type, operator: In, values: [m7i.xlarge] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
        - { key: topology.kubernetes.io/zone, operator: In, values: [@@ZONES@@] }
  limits: { cpu: "@@LIMIT_CPU@@" }
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
