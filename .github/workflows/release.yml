name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  # A published release becomes /releases/latest at once, but its files only
  # arrive when the release job finishes, about half an hour later. install.sh
  # and the cluster docs download from /releases/latest/download/, so in that
  # window every new install gets a 404, and a failed build leaves it that way.
  # RELEASING.md publishes with --latest=false. This job covers a release
  # published with --latest anyway: it points latest back at the previous
  # stable release, and the release job moves it forward once the files are
  # attached. A prerelease is never latest, so for one this is a no-op.
  hold-latest:
    name: Keep the previous release as latest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reject a release tag that is not a version
        run: |
          # Same check as the test job. The tag reaches gh below.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release tag must look like v1.2.3"
            exit 1
          fi

      - name: Point latest at the previous stable release
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [[ "$latest" != "$VERSION" ]]; then
            echo "Latest is $latest, not $VERSION. Nothing to hold."
            exit 0
          fi
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' | grep -vxF "$VERSION" | sort -V | tail -n 1)"
          if [[ -z "$previous" ]]; then
            echo "No earlier stable release. Latest stays on $VERSION."
            exit 0
          fi
          gh release edit "$previous" --latest
          echo "Latest is $previous until $VERSION has its files."

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Reject a release tag that is not a version
        run: |
          # A release tag is metadata from outside this file. Refuse anything
          # that is not a version before checkout or a script can use it.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release tag must look like v1.2.3"
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERSION }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Run Go tests
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1

      - name: Run TypeScript SDK build and tests
        working-directory: sdk/typescript
        run: |
          npm run build
          npm test

  build:
    name: Build - ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ github.event.release.tag_name }}
      LDFLAGS: -X github.com/aerol-ai/microvm/internal/version.Version=${{ github.event.release.tag_name }}
    strategy:
      matrix:
        include:
          # Linux — sandboxd (CGO) + toolboxd
          - name: Linux x86_64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux_amd64
            cc: gcc
            apt_pkgs: build-essential
            goarm: ""

          - name: Linux x86
            runner: ubuntu-latest
            goos: linux
            goarch: "386"
            suffix: linux_386
            cc: gcc
            apt_pkgs: "build-essential gcc-multilib"
            goarm: ""

          - name: Linux aarch64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux_arm64
            cc: aarch64-linux-gnu-gcc
            apt_pkgs: "build-essential gcc-aarch64-linux-gnu"
            goarm: ""

          - name: Linux armv7hf
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            suffix: linux_armv7
            cc: arm-linux-gnueabihf-gcc
            apt_pkgs: "build-essential gcc-arm-linux-gnueabihf"
            goarm: "7"

          - name: Linux armv6
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            suffix: linux_armv6
            cc: arm-linux-gnueabi-gcc
            apt_pkgs: "build-essential gcc-arm-linux-gnueabi"
            goarm: "6"

          # FreeBSD — toolboxd only (CGO=0, no cross-compiler available)
          - name: Freebsd x86_64
            runner: ubuntu-latest
            goos: freebsd
            goarch: amd64
            suffix: freebsd_amd64
            cc: ""
            apt_pkgs: ""
            goarm: ""

          - name: Freebsd x86
            runner: ubuntu-latest
            goos: freebsd
            goarch: "386"
            suffix: freebsd_386
            cc: ""
            apt_pkgs: ""
            goarm: ""

          # macOS — sandboxd (CGO, for install.sh --local) + toolboxd.
          # The org has no macOS runners, so sandboxd cross-compiles on Linux
          # with zig as the C toolchain (.github/darwin-cross/setup.sh). The
          # in-sandbox agent install.sh mounts on macOS is the Linux toolboxd
          # (containers run in Docker's Linux VM); toolboxd_darwin_* is still
          # published for direct use.
          # - name: MacOS x86_64
          #   runner: ubuntu-latest
          #   goos: darwin
          #   goarch: amd64
          #   suffix: darwin_amd64
          #   cc: "zig cc -target x86_64-macos.14.0"
          #   apt_pkgs: llvm
          #   goarm: ""

          - name: MacOS aarch64
            runner: ubuntu-latest
            goos: darwin
            goarch: arm64
            suffix: darwin_arm64
            cc: "zig cc -target aarch64-macos.14.0"
            apt_pkgs: llvm
            goarm: ""

    steps:
      - name: Reject a release tag that is not a version
        run: |
          # Same check as the test job. The tag is copied into ldflags, so a
          # value that is not a version must not reach the compiler.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release tag must look like v1.2.3"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERSION }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && matrix.apt_pkgs != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_pkgs }}

      - name: Set up darwin cross toolchain
        if: matrix.goos == 'darwin'
        shell: bash
        run: bash .github/darwin-cross/setup.sh

      - name: Build sandboxd (Linux + macOS, CGO enabled)
        if: matrix.goos == 'linux' || matrix.goos == 'darwin'
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "$LDFLAGS" -o dist/sandboxd_${{ matrix.suffix }} ./cmd/sandboxd
          chmod 0755 dist/sandboxd_${{ matrix.suffix }}

      # Upgrade checks (Ansible's update-sandboxd.yml, the docs' "Upgrading"
      # steps, integration-tests/upgrade-gate.sh) read the version from
      # `sandboxd --version`, so a release whose binary misreports it would
      # pass them all while running the wrong build.
      - name: Check the linux_amd64 sandboxd reports the release version
        if: matrix.suffix == 'linux_amd64'
        shell: bash
        run: |
          # The whole output first, then its first line: `| head -n1` under
          # pipefail can fail on SIGPIPE when head exits before the rest.
          out="$(dist/sandboxd_linux_amd64 --version)"
          got="${out%%$'\n'*}"
          if [[ "$got" != "sandboxd $VERSION" ]]; then
            echo "::error::sandboxd --version printed '$got', want 'sandboxd $VERSION'"
            exit 1
          fi

      # Same check as test.yml: macOS kills an unsigned arm64 binary at launch.
      - name: Check the darwin binary is signed
        if: matrix.suffix == 'darwin_arm64'
        shell: bash
        run: |
          llvm-objdump --macho --private-headers dist/sandboxd_${{ matrix.suffix }} | grep LC_CODE_SIGNATURE >/dev/null ||
            { echo "::error::sandboxd_${{ matrix.suffix }} has no code signature; macOS will not run it"; exit 1; }

      - name: Build toolboxd
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "$LDFLAGS" -o dist/toolboxd_${{ matrix.suffix }} ./cmd/toolboxd
          chmod 0755 dist/toolboxd_${{ matrix.suffix }}

      - name: Build custom Caddy (Linux only)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.6
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
            "$(go env GOPATH)/bin/xcaddy" build \
            --output dist/caddy_${{ matrix.suffix }} \
            --with github.com/mholt/caddy-l4@v0.1.2 \
            --with github.com/caddy-dns/cloudflare@v0.2.4 \
            --with github.com/ss098/certmagic-s3@v0.0.0-20250922022452-8af482af5f39
          chmod 0755 dist/caddy_${{ matrix.suffix }}
          if [[ "${{ matrix.goarch }}" == "amd64" ]]; then
            dist/caddy_${{ matrix.suffix }} list-modules | grep -qx 'layer4'
            dist/caddy_${{ matrix.suffix }} list-modules | grep -qx 'layer4.handlers.proxy'
            dist/caddy_${{ matrix.suffix }} list-modules | grep -qx 'dns.providers.cloudflare'
            dist/caddy_${{ matrix.suffix }} list-modules | grep -qx 'caddy.storage.s3'
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.suffix }}
          path: dist/

  # aerolvm, the agent CLI and stdio MCP server, is a static CGO_ENABLED=0
  # client (cmd/aerolvm/deps_test.go keeps it free of server packages), so
  # one runner cross-compiles every platform. The npm job and
  # cmd/aerolvm/distribution_test.go both expect exactly this target list.
  cli:
    name: Build - aerolvm CLI
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}
      LDFLAGS: -X github.com/aerol-ai/microvm/internal/version.Version=${{ github.event.release.tag_name }}
    steps:
      - name: Reject a release tag that is not a version
        run: |
          # Same check as the test job. The tag is copied into ldflags.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release tag must look like v1.2.3"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERSION }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build aerolvm for every platform
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [[ "$goos" == "windows" ]]; then
              ext=".exe"
            fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$LDFLAGS" -o "dist/aerolvm_${goos}_${goarch}${ext}" ./cmd/aerolvm
          done
          chmod 0755 dist/aerolvm_*

      - name: Check the linux_amd64 build reports the release version
        run: |
          got="$(dist/aerolvm_linux_amd64 version)"
          if [[ "$got" != "$VERSION" ]]; then
            echo "::error::aerolvm version printed '$got', want '$VERSION'"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-aerolvm
          path: dist/

  release:
    name: Publish release
    needs: [hold-latest, build, cli]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Reject a release tag that is not a version
        run: |
          # Same check as the test job. The tag becomes a release asset name.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release tag must look like v1.2.3"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERSION }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      # Terraform's seed bootstrap downloads cluster-sign-node.sh from
      # /releases/latest/download/ (Terraform/variables.tf), and the operator
      # docs download uninstall.sh from there, so every script a Terraform
      # default or a doc names must ship here; integration-tests/safety
      # TestTerraformReleaseURLsNameShippedAssets and
      # TestDocsReleaseURLsNameShippedAssets keep them in step.
      - name: Copy install scripts
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/uninstall.sh dist/uninstall.sh
          cp scripts/cluster-init.sh dist/cluster-init.sh
          cp scripts/cluster-join.sh dist/cluster-join.sh
          cp scripts/cluster-sign-node.sh dist/cluster-sign-node.sh
          chmod 0755 dist/install.sh dist/uninstall.sh dist/cluster-init.sh dist/cluster-join.sh dist/cluster-sign-node.sh

      - name: Generate CycloneDX SBOM
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 mod -json -output dist/sbom.cdx.json

      # The unversioned name is what install.sh and the cluster docs download
      # from /releases/latest/download/. The copy prefixed with the tag is the
      # same bytes under a name that carries the release identifier.
      - name: Copy each asset under a name that includes the release tag
        run: |
          cd dist
          for asset in *; do
            case "$asset" in
              checksums.txt|sbom.cdx.json|*.intoto.jsonl) continue ;;
            esac
            cp "$asset" "${VERSION}_${asset}"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Attest release artifacts
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Publish the SLSA provenance bundle AS a release asset (in addition to the
      # attestation stored in GitHub's attestation API) so consumers — and the
      # OpenSSF Scorecard Signed-Releases check — can verify the artifacts from
      # the release page. Copied in after attestation so it is not its own subject.
      - name: Attach provenance to release assets
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/${VERSION}.intoto.jsonl"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
          # Latest moves only in the next step, once every file is attached.
          make_latest: "false"

      # Only the newest stable release becomes latest, so re-running this
      # workflow for an older tag never moves /releases/latest backwards.
      - name: Mark the release as latest
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          newest="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' | sort -V | tail -n 1)"
          if [[ "$newest" != "$VERSION" ]]; then
            echo "$newest is newer than $VERSION, so latest stays on $newest."
            exit 0
          fi
          gh release edit "$VERSION" --latest

  # A second home for the release files, for when github.com release
  # downloads fail (they returned 504 for hours on 2026-11-08, from a laptop
  # and from AWS alike, so new nodes could not install Caddy). The same files
  # go to s3://aerolvm-downloads/aerolvm/<tag>/, which anyone can read; the
  # download side that falls back to it lives in install.sh and the harness.
  # A job of its own, after the GitHub release: a mirror failure never holds
  # back the binaries, and "Re-run failed jobs" retries just this. It reads
  # the published release, checks every file against its checksums.txt, then
  # syncs, so the mirror holds exactly what GitHub serves; a release that
  # became GitHub's latest also becomes the mirror's (latest.txt). Off until the
  # one-time setup is done (RELEASING.md, "The download mirror"): set the
  # repository variable AEROLVM_MIRROR_ROLE_ARN to the role it assumes.
  mirror:
    name: Copy the release files to the download mirror
    needs: release
    if: vars.AEROLVM_MIRROR_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
      MIRROR_BUCKET: aerolvm-downloads
    steps:
      - name: Reject a release tag that is not a version
        run: |
          # Same check as the test job. The tag becomes part of the S3 key.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release tag must look like v1.2.3"
            exit 1
          fi

      - name: Download the published release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$VERSION" --dir dist

      - name: Check every file against checksums.txt
        run: |
          cd dist
          sha256sum --check --strict checksums.txt
          # checksums.txt does not list itself or the provenance bundle;
          # anything else unlisted would be an extra, unchecked file.
          unlisted=$(comm -23 <(ls | sort) <(awk '{print $2}' checksums.txt | sort) \
            | grep -vxF -e checksums.txt -e "${VERSION}.intoto.jsonl" || true)
          if [[ -n "$unlisted" ]]; then
            echo "::error::release files not in checksums.txt: $unlisted"
            exit 1
          fi

      - name: Get AWS credentials for the mirror (GitHub OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AEROLVM_MIRROR_ROLE_ARN }}
          role-session-name: release-mirror-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: us-east-1

      - name: Copy the files to the mirror
        run: aws s3 sync dist/ "s3://${MIRROR_BUCKET}/aerolvm/${VERSION}/" --only-show-errors --no-progress

      - name: Check the mirror serves the same checksums.txt
        run: |
          url="https://${MIRROR_BUCKET}.s3.us-east-1.amazonaws.com/aerolvm/${VERSION}/checksums.txt"
          if ! curl -fsSL --retry 3 "$url" | cmp -s - dist/checksums.txt; then
            echo "::error::$url does not match the release's checksums.txt"
            exit 1
          fi
          echo "Mirrored $(ls dist | wc -l) files to $url"

      # install.sh finds "latest" on the mirror by reading aerolvm/latest.txt
      # (#1051, the download side). It names this tag only when the release
      # job made it GitHub's latest, and moves only after every file is up and
      # checked above, so an install that reads it never finds a release half
      # uploaded. Same format as scripts/mirror-sync.sh writes.
      - name: Point the mirror's latest.txt at this release, if it is GitHub's latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [[ "$latest" != "$VERSION" ]]; then
            echo "GitHub's latest release is $latest, so aerolvm/latest.txt stays as it is."
            exit 0
          fi
          printf '%s\n' "$VERSION" > latest.txt
          aws s3 cp latest.txt "s3://${MIRROR_BUCKET}/aerolvm/latest.txt" \
            --content-type text/plain --cache-control no-cache --only-show-errors --no-progress
          echo "aerolvm/latest.txt now names $VERSION"

      # The third-party files this release's install.sh pins (CNI plugins,
      # BuildKit, Firecracker, Caddy, workerd) are its fallback too. A pin
      # bump used to need a hand-run `mirror-sync.sh --deps`, and a forgotten
      # one left the new version without a mirror copy. This runs it on every
      # release: it first asks the public mirror, and when every pinned file
      # is there (the usual case) it downloads and uploads nothing. Otherwise
      # it checks every file against its pin before uploading any. Last in the
      # job, so the release files and latest.txt above never wait on it.
      - name: Check out this release's install.sh (its download pins)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERSION }}
          path: src
          persist-credentials: false

      - name: Copy any pinned third-party file the mirror lacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: src/scripts/mirror-sync.sh --deps --bucket "$MIRROR_BUCKET"

  # npm and the MCP Registry are opt-in until their one-time setup is done
  # (npm/README.md): set the repository variable AEROLVM_NPM_PUBLISH=true.
  # Both run after the GitHub release, so a failure here never holds back
  # the binaries, and both are safe to re-run.
  npm:
    name: Publish aerolvm to npm
    needs: release
    if: vars.AEROLVM_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Reject a release tag that is not a version
        run: |
          # Same check as the test job. The tag becomes the npm version.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release tag must look like v1.2.3"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERSION }}

      # No registry-url: setup-node would write an _authToken line into
      # .npmrc, and any _authToken makes npm skip OIDC trusted publishing
      # (actions/setup-node#1551).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Download the aerolvm binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-aerolvm
          path: dist/

      - name: Stage the npm packages
        run: node npm/stage.mjs "$VERSION" dist npm-dist

      - name: Publish through GitHub OIDC trusted publishing
        run: |
          # Node 22 ships npm older than 11.5.1, the first release that can
          # publish with OIDC. .github/npm-cli pins a newer one; see the
          # npm job in publish-sdks.yml.
          npm ci --prefix "$GITHUB_WORKSPACE/.github/npm-cli"
          npm_bin="$GITHUB_WORKSPACE/.github/npm-cli/node_modules/.bin/npm"
          node -e 'const [maj,min,pat]=process.argv[1].split(".").map(Number); if (maj<11 || (maj===11 && (min<5 || (min===5 && pat<1)))) { console.error("npm "+process.argv[1]+" cannot do trusted publishing; need >= 11.5.1"); process.exit(1); }' "$("$npm_bin" -v)"
          version="${VERSION#v}"
          # A prerelease must not become what `npx @aerol-ai/aerolvm` runs.
          tag="latest"
          if [[ "$version" == *-* ]]; then
            tag="next"
          fi
          # order.txt lists every platform package before the launcher.
          while read -r dir; do
            name="$(node -p "require('./npm-dist/$dir/package.json').name")"
            if "$npm_bin" view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::notice::${name}@${version} is already on npm; skipping"
              continue
            fi
            (cd "npm-dist/$dir" && "$npm_bin" publish --access public --tag "$tag")
          done < npm-dist/order.txt

  mcp-registry:
    name: Publish to the MCP Registry
    needs: npm
    # The registry lists one latest version per server; prereleases stay off it.
    if: vars.AEROLVM_NPM_PUBLISH == 'true' && !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
      # Pinned mcp-publisher release and the SHA-256 of its linux_amd64
      # tarball. Bump both together.
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Reject a release tag that is not a version
        run: |
          # Same check as the test job. The tag becomes the server version.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must look like v1.2.3"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERSION }}

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Stamp the release version into server.json
        run: |
          version="${VERSION#v}"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      # The registry checks the npm package's mcpName when it accepts the
      # entry, so wait until the version just published is visible.
      - name: Wait for the npm package
        run: |
          version="${VERSION#v}"
          for _ in $(seq 1 30); do
            if [[ "$(npm view "@aerol-ai/aerolvm@${version}" mcpName 2>/dev/null)" == "io.github.aerol-ai/aerolvm" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::@aerol-ai/aerolvm@${version} did not appear on npm with its mcpName"
          exit 1

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
