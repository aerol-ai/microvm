name: Publish SDKs

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: SDK version to publish, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  SDK_VERSION: ${{ github.event.inputs.sdk_version }}

jobs:
  validate:
    name: Validate SDK version
    runs-on: ubuntu-latest
    steps:
      - name: Reject an SDK version that is not a version
        env:
          SDK_VERSION: ${{ github.event.inputs.sdk_version }}
        run: |
          # workflow_dispatch input is metadata from outside this file.
          # Refuse anything that is not a version before a publish script uses it.
          if [[ ! "$SDK_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::sdk_version must look like 0.1.0 or v0.1.0"
            exit 1
          fi

  java:
    name: Publish Java SDK to GitHub Packages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sdk/java/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify package version matches requested SDK version
        run: |
          package_version="$(python -c "import xml.etree.ElementTree as ET; root = ET.parse('pom.xml').getroot(); ns = {'m': 'http://maven.apache.org/POM/4.0.0'}; print(root.findtext('m:version', namespaces=ns) or '')")"
          release_version="${SDK_VERSION#v}"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "::error::sdk/java/pom.xml version $package_version does not match requested SDK version $release_version"
            exit 1
          fi

      - name: Check whether package version is already published
        id: java_publish_state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t artifact_urls < <(python - <<'PY'
          import xml.etree.ElementTree as ET

          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          root = ET.parse('pom.xml').getroot()
          group_id = root.findtext('m:groupId', namespaces=ns) or root.findtext('m:parent/m:groupId', namespaces=ns) or ''
          artifact_id = root.findtext('m:artifactId', namespaces=ns) or ''
          version = root.findtext('m:version', namespaces=ns) or root.findtext('m:parent/m:version', namespaces=ns) or ''
          packaging = root.findtext('m:packaging', namespaces=ns) or 'jar'

          base = f"https://maven.pkg.github.com/aerol-ai/microvm/{group_id.replace('.', '/')}/{artifact_id}/{version}"
          print(f"{base}/{artifact_id}-{version}.pom")
          print(f"{base}/{artifact_id}-{version}.{packaging}")
          print(f"{base}/{artifact_id}-{version}-sources.jar")
          print(f"{base}/{artifact_id}-{version}-javadoc.jar")
          PY
          )

          existing_artifacts=0
          for artifact_url in "${artifact_urls[@]}"; do
            if curl -fsSIL -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "$artifact_url" >/dev/null; then
              existing_artifacts=$((existing_artifacts + 1))
            fi
          done

          if [[ "$existing_artifacts" -eq 0 ]]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$existing_artifacts" -ne "${#artifact_urls[@]}" ]]; then
            echo "::error::Java SDK version ${SDK_VERSION#v} is only partially present in GitHub Packages. Delete that package version or publish a new SDK version instead of retrying this deploy."
            exit 1
          fi

          echo "already_published=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Java SDK version ${SDK_VERSION#v} is already present in GitHub Packages; skipping deploy on this rerun."

      - name: Run tests
        run: mvn -B -ntp test

      - name: Validate publish payload
        run: mvn -B -ntp -DskipTests package

      - name: Publish package
        if: steps.java_publish_state.outputs.already_published != 'true'
        run: mvn -B -ntp -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: Publish TypeScript SDK to npm
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      # No registry-url: setup-node would write an _authToken line into
      # .npmrc, and any _authToken makes npm skip OIDC trusted publishing
      # (actions/setup-node#1551). Publish then sends the classic token,
      # and npm answers EOTP because this job cannot enter an authenticator code.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Verify package version matches requested SDK version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          release_version="${SDK_VERSION#v}"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "::error::sdk/typescript/package.json version $package_version does not match requested SDK version $release_version"
            exit 1
          fi

      - name: Check whether package version is already published
        id: npm_publish_state
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::TypeScript SDK version $package_version is already present on npm; skipping deploy on this rerun."
            exit 0
          fi

          echo "already_published=false" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Validate publish payload
        run: npm pack --dry-run

      - name: Publish package
        if: steps.npm_publish_state.outputs.already_published != 'true'
        run: |
          # Publish through GitHub OIDC trusted publishing. A classic npm
          # token cannot satisfy publish 2FA, so the registry returns EOTP.
          #
          # Node 22 ships npm older than 11.5.1, the first release that
          # exchanges ACTIONS_ID_TOKEN_REQUEST_*. Install 11.21.0 from the
          # lockfile in .github/npm-cli. `npm ci` checks those integrity hashes
          # and its postinstall replaces the vulnerable bundled copies of
          # brace-expansion, http-cache-semantics, ip-address, and undici.
          #
          # Refuse to publish if a classic token is still configured. Any
          # _authToken entry, including one that expands empty, makes npm
          # skip OIDC (actions/setup-node#1551).
          npm ci --prefix "$GITHUB_WORKSPACE/.github/npm-cli"
          npm_bin="$GITHUB_WORKSPACE/.github/npm-cli/node_modules/.bin/npm"
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [[ -f "$npmrc" ]]; then
            sed -i -E '/_authToken/d' "$npmrc"
          fi
          unset NODE_AUTH_TOKEN
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]] || { [[ -f "$npmrc" ]] && grep -q '_authToken' "$npmrc"; }; then
            echo "::error::classic npm auth is still configured; refusing to publish with a 2FA token"
            exit 1
          fi
          echo "publishing with npm $("$npm_bin" -v)"
          node -e 'const [maj,min,pat]=process.argv[1].split(".").map(Number); if (maj<11 || (maj===11 && (min<5 || (min===5 && pat<1)))) { console.error("npm "+process.argv[1]+" cannot do trusted publishing; need >= 11.5.1"); process.exit(1); }' "$("$npm_bin" -v)"
          "$npm_bin" publish --access public

  pypi:
    name: Publish Python SDK to PyPI
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            sdk/python/requirements-ci.txt

      - name: Verify PyPI token is configured
        run: |
          if [[ -z "${PYPI_API_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret PYPI_API_TOKEN"
            exit 1
          fi
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Verify package version matches requested SDK version
        run: |
          package_version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          release_version="${SDK_VERSION#v}"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "::error::sdk/python/pyproject.toml version $package_version does not match requested SDK version $release_version"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          # Hash-pin third-party packages. Install this repo with --no-deps so
          # pip does not fetch an unpinned dependency tree for the local package.
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: sdk/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  crates:
    name: Publish Rust SDK to crates.io
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify crates.io token is configured
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret CARGO_REGISTRY_TOKEN"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify package version matches requested SDK version
        run: |
          package_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          release_version="${SDK_VERSION#v}"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "::error::sdk/rust/Cargo.toml version $package_version does not match requested SDK version $release_version"
            exit 1
          fi

      - name: Run tests
        run: cargo test

      - name: Validate publish payload
        run: cargo publish --dry-run

      - name: Publish crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
