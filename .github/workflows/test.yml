name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      go_main: ${{ steps.filter.outputs.go_main }}
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      java_sdk: ${{ steps.filter.outputs.java_sdk }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
      typescript_sdk: ${{ steps.filter.outputs.typescript_sdk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - 'docs/**'
            go_main:
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
            go_sdk:
              - 'sdk/go/**'
              - 'go.mod'
              - 'go.sum'
            java_sdk:
              - 'sdk/java/**'
            python_sdk:
              - 'sdk/python/**'
            typescript_sdk:
              - 'sdk/typescript/**'

  go-tests:
    needs: changes
    if: needs.changes.outputs.docs != 'true' && needs.changes.outputs.go_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run unit tests with coverage
        run: |
          go test -count=1 -coverprofile=coverage.out ./cmd/... ./internal/... ./pkg/...
          go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aerol-ai/microvm
          files: coverage.out
          flags: go-main
          fail_ci_if_error: false

  wasm-integration:
    # Live-AOCR round-trip for the BYO module push/pull path (plan §7.2): proves
    # the .wasm mediaType survives a real registry, which mocks can't. Gated
    # behind the `integration` build tag AND the presence of AOCR creds — the
    # test self-skips when AEROL_WASM_IT_* are unset, so forks and credential-less
    # PRs stay green. Runs only when daemon Go code changed.
    needs: changes
    if: needs.changes.outputs.docs != 'true' && needs.changes.outputs.go_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run WASM module registry integration test
        env:
          AEROL_WASM_IT_REF: ${{ secrets.AEROL_WASM_IT_REF }}
          AEROL_WASM_IT_USERNAME: ${{ secrets.AEROL_WASM_IT_USERNAME }}
          AEROL_WASM_IT_TOKEN: ${{ secrets.AEROL_WASM_IT_TOKEN }}
        run: go test -count=1 -tags integration -run TestIntegrationModulePushPullRoundTrip ./pkg/wasmmod/...

  go-sdk-tests:
    needs: changes
    if: needs.changes.outputs.docs != 'true' && needs.changes.outputs.go_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go SDK tests
        run: go test -count=1 ./sdk/go/...

  java-sdk-tests:
    needs: changes
    if: needs.changes.outputs.docs != 'true' && needs.changes.outputs.java_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sdk/java/pom.xml

      - name: Run Java SDK tests
        run: mvn -B -ntp test

  python-sdk-tests:
    needs: changes
    if: needs.changes.outputs.docs != 'true' && needs.changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install Python SDK dependencies
        run: python -m pip install .

      - name: Run Python SDK tests
        run: python -m unittest discover -s tests -v

  typescript-sdk-tests:
    needs: changes
    if: needs.changes.outputs.docs != 'true' && needs.changes.outputs.typescript_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK dependencies
        run: npm ci

      - name: Build TypeScript SDK
        run: npm run build

      - name: Run TypeScript SDK tests
        run: npm test