name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      go_main: ${{ steps.filter.outputs.go_main }}
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      java_sdk: ${{ steps.filter.outputs.java_sdk }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
      typescript_sdk: ${{ steps.filter.outputs.typescript_sdk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            docs:
              - 'docs/**'
            go_main:
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - 'integration-tests/suite/harness/**'
              - '.github/workflows/test.yml'
              - 'scripts/scale-gates.sh'
            go_sdk:
              - 'sdk/go/**'
              - 'go.mod'
              - 'go.sum'
            java_sdk:
              - 'sdk/java/**'
            python_sdk:
              - 'sdk/python/**'
            typescript_sdk:
              - 'sdk/typescript/**'

  go-tests:
    needs: changes
    if: needs.changes.outputs.go_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run unit tests with coverage
        run: |
          go test -count=1 -coverprofile=coverage.out ./cmd/... ./internal/... ./pkg/...
          go tool cover -func=coverage.out | tail -n 1

      - name: Scale gates
        run: AEROLVM_SCALE_GATES=1 go test -count=1 -timeout 20m -run 'TestScaleGate|TestScaleHarness' ./internal/cluster ./internal/service

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aerol-ai/microvm
          files: coverage.out
          flags: go-main
          fail_ci_if_error: false

  go-race:
    needs: changes
    if: needs.changes.outputs.go_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Race test all daemon packages
        run: go test -race -count=1 -timeout 25m ./cmd/... ./internal/... ./pkg/...

  go-security:
    needs: changes
    if: needs.changes.outputs.go_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet production packages
        run: go vet ./cmd/... ./internal/... ./pkg/...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  wasm-integration:
    # Live-AOCR round-trip for the BYO module push/pull path (plan §7.2): proves
    # the .wasm mediaType survives a real registry, which mocks can't. Gated
    # behind the `integration` build tag AND the presence of AOCR creds — the
    # test self-skips when AEROL_WASM_IT_* are unset, so forks and credential-less
    # PRs stay green. Runs only when daemon Go code changed.
    needs: changes
    if: needs.changes.outputs.go_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run WASM module registry integration test
        env:
          AEROL_WASM_IT_REF: ${{ secrets.AEROL_WASM_IT_REF }}
          AEROL_WASM_IT_USERNAME: ${{ secrets.AEROL_WASM_IT_USERNAME }}
          AEROL_WASM_IT_TOKEN: ${{ secrets.AEROL_WASM_IT_TOKEN }}
        run: go test -count=1 -tags integration -run TestIntegrationModulePushPullRoundTrip ./pkg/wasmmod/...

  go-sdk-tests:
    needs: changes
    if: needs.changes.outputs.go_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go SDK tests
        run: go test -count=1 ./sdk/go/...

  java-sdk-tests:
    needs: changes
    if: needs.changes.outputs.java_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sdk/java/pom.xml

      - name: Run Java SDK tests
        run: mvn -B -ntp test

  python-sdk-tests:
    needs: changes
    if: needs.changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install Python SDK dependencies
        run: python -m pip install .

      - name: Run Python SDK tests
        run: python -m unittest discover -s tests -v

  typescript-sdk-tests:
    needs: changes
    if: needs.changes.outputs.typescript_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK dependencies
        run: npm ci

      - name: Build TypeScript SDK
        run: npm run build

      - name: Run TypeScript SDK tests
        run: npm test
