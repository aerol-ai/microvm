name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue re-runs the required `changes` check on a temporary
  # merge commit. That event is merge_group, not pull_request, so without
  # this trigger the queue waits until check_response_timeout and fails.
  merge_group:

permissions:
  contents: read

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      go_main: ${{ steps.filter.outputs.go_main }}
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      java_sdk: ${{ steps.filter.outputs.java_sdk }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
      typescript_sdk: ${{ steps.filter.outputs.typescript_sdk }}
      rust_sdk: ${{ steps.filter.outputs.rust_sdk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A missing trailer fails this job. The required `changes` job below
      # depends on it, so a commit cannot reach the default branch without
      # the assertion.
      - name: Require DCO sign-off on every commit
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::refusing to check DCO without a commit SHA"
            exit 1
          fi
          missing=0
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            trailer="$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            if ! grep -Eq '<[^>@[:space:]]+@[^>[:space:]]+>' <<<"$trailer"; then
              echo "::error::commit ${sha} has no Signed-off-by trailer. Use git commit -s."
              git log -1 --format='%h %s' "$sha"
              missing=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..HEAD")
          exit "$missing"

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            docs:
              - 'docs/**'
            go_main:
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - 'integration-tests/suite/harness/**'
              - '.github/workflows/test.yml'
              - 'scripts/scale-gates.sh'
            go_sdk:
              - 'sdk/go/**'
              - 'go.mod'
              - 'go.sum'
            java_sdk:
              - 'sdk/java/**'
            python_sdk:
              - 'sdk/python/**'
            typescript_sdk:
              - 'sdk/typescript/**'
            rust_sdk:
              - 'sdk/rust/**'

  go-tests:
    needs: paths
    if: needs.paths.outputs.go_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run unit tests with coverage
        run: |
          AEROLVM_SCALE_GATES=1 go test -count=1 -timeout 20m -coverprofile=coverage.out ./cmd/... ./internal/... ./pkg/...
          go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aerol-ai/microvm
          files: coverage.out
          flags: go-main
          fail_ci_if_error: false

  go-race:
    needs: paths
    if: needs.paths.outputs.go_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Race test all daemon packages
        run: go test -race -count=1 -timeout 25m ./cmd/... ./internal/... ./pkg/...

  go-security:
    needs: paths
    if: needs.paths.outputs.go_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet production packages
        run: go vet ./cmd/... ./internal/... ./pkg/...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  wasm-integration:
    # Live-AOCR round-trip for the BYO module push/pull path (plan §7.2): proves
    # the .wasm mediaType survives a real registry, which mocks can't. Gated
    # behind the `integration` build tag AND the presence of AOCR creds — the
    # test self-skips when AEROL_WASM_IT_* are unset, so forks and credential-less
    # PRs stay green. Runs only when daemon Go code changed.
    needs: paths
    if: needs.paths.outputs.go_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run WASM module registry integration test
        env:
          AEROL_WASM_IT_REF: ${{ secrets.AEROL_WASM_IT_REF }}
          AEROL_WASM_IT_USERNAME: ${{ secrets.AEROL_WASM_IT_USERNAME }}
          AEROL_WASM_IT_TOKEN: ${{ secrets.AEROL_WASM_IT_TOKEN }}
        run: go test -count=1 -tags integration -run TestIntegrationModulePushPullRoundTrip ./pkg/wasmmod/...

  go-sdk-tests:
    needs: paths
    if: needs.paths.outputs.go_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go SDK tests
        run: go test -count=1 ./sdk/go/...

  java-sdk-tests:
    needs: paths
    if: needs.paths.outputs.java_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sdk/java/pom.xml

      - name: Run Java SDK tests
        run: mvn -B -ntp test

  python-sdk-tests:
    needs: paths
    if: needs.paths.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            sdk/python/requirements-ci.txt

      - name: Install Python SDK dependencies
        run: |
          # Hash-pin third-party packages. Install this repo with --no-deps so
          # pip does not fetch an unpinned dependency tree for the local package.
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run Python SDK tests
        run: python -m unittest discover -s tests -v

  typescript-sdk-tests:
    needs: paths
    if: needs.paths.outputs.typescript_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK dependencies
        run: npm ci

      - name: Build TypeScript SDK
        run: npm run build

      - name: Run TypeScript SDK tests
        run: npm test

  rust-sdk-tests:
    needs: paths
    if: needs.paths.outputs.rust_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sdk/rust

      - name: Run Rust SDK tests
        run: cargo test --locked

  # Runs on every pull request, including docs-only changes, so a commit is
  # never accepted without at least one test suite having run.
  baseline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the Go SDK test suite
        run: go test -count=1 ./sdk/go/...

  # Job id stays `changes` because ruleset 16186085 requires that check.
  # It runs even when a suite fails (if: always); a skipped required check
  # would otherwise let the pull request merge.
  changes:
    needs:
      - paths
      - baseline-tests
      - go-tests
      - go-race
      - go-security
      - wasm-integration
      - go-sdk-tests
      - java-sdk-tests
      - python-sdk-tests
      - typescript-sdk-tests
      - rust-sdk-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every applicable test suite passed
        env:
          PATHS: ${{ needs.paths.result }}
          BASELINE: ${{ needs.baseline-tests.result }}
          GO_MAIN: ${{ needs.paths.outputs.go_main }}
          GO_SDK: ${{ needs.paths.outputs.go_sdk }}
          JAVA_SDK: ${{ needs.paths.outputs.java_sdk }}
          PYTHON_SDK: ${{ needs.paths.outputs.python_sdk }}
          TYPESCRIPT_SDK: ${{ needs.paths.outputs.typescript_sdk }}
          RUST_SDK: ${{ needs.paths.outputs.rust_sdk }}
          GO_TESTS: ${{ needs.go-tests.result }}
          GO_RACE: ${{ needs.go-race.result }}
          GO_SECURITY: ${{ needs.go-security.result }}
          WASM_INTEGRATION: ${{ needs.wasm-integration.result }}
          GO_SDK_TESTS: ${{ needs.go-sdk-tests.result }}
          JAVA_SDK_TESTS: ${{ needs.java-sdk-tests.result }}
          PYTHON_SDK_TESTS: ${{ needs.python-sdk-tests.result }}
          TYPESCRIPT_SDK_TESTS: ${{ needs.typescript-sdk-tests.result }}
          RUST_SDK_TESTS: ${{ needs.rust-sdk-tests.result }}
        run: |
          fail=0
          require_success() {
            if [[ "$2" != "success" ]]; then
              echo "::error::$1 is $2"
              fail=1
            fi
          }
          require_if_selected() {
            if [[ "$1" == "true" && "$3" != "success" ]]; then
              echo "::error::$2 is $3"
              fail=1
            fi
          }
          require_success paths "$PATHS"
          require_success baseline-tests "$BASELINE"
          require_if_selected "$GO_MAIN" go-tests "$GO_TESTS"
          require_if_selected "$GO_MAIN" go-race "$GO_RACE"
          require_if_selected "$GO_MAIN" go-security "$GO_SECURITY"
          require_if_selected "$GO_MAIN" wasm-integration "$WASM_INTEGRATION"
          require_if_selected "$GO_SDK" go-sdk-tests "$GO_SDK_TESTS"
          require_if_selected "$JAVA_SDK" java-sdk-tests "$JAVA_SDK_TESTS"
          require_if_selected "$PYTHON_SDK" python-sdk-tests "$PYTHON_SDK_TESTS"
          require_if_selected "$TYPESCRIPT_SDK" typescript-sdk-tests "$TYPESCRIPT_SDK_TESTS"
          require_if_selected "$RUST_SDK" rust-sdk-tests "$RUST_SDK_TESTS"
          exit "$fail"
