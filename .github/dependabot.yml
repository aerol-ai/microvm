version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # containerd v1.7.34 assigns specs.LinuxPids.Limit as int64.
      # runtime-spec v1.3.0 changed that field to *int64 and fails the build.
      - dependency-name: "github.com/opencontainers/runtime-spec"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The ready-made images pin their base image by digest. A digest never
  # moves, so without this entry they would miss the base image's security
  # rebuilds. Dependabot moves the tag and the digest together.
  - package-ecosystem: "docker"
    directories:
      - "/images/*"
      # The Kubernetes images' bases (aerolvm, -runtime, -edge): each FROM
      # is a tag pinned by digest, and Dependabot moves the digest.
      - "/packaging/images"
    schedule:
      interval: "weekly"
    ignore:
      # images/computer-use installs cp312 wheels pinned by hash. A new
      # Python minor needs new wheels, so it is a hand change, not a bump.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    ignore:
      # astro-mermaid@2.1.0 peers mermaid ^10 || ^11. A mermaid 12 bump
      # fails npm ci (ERESOLVE) on Cloudflare Pages.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/sdk/python"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/sdk/java"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/sdk/rust"
    schedule:
      interval: "weekly"