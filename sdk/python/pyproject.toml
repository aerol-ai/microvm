[project]
name = "aerolvm-sdk"
version = "0.8.2"
description = "A Python client for the Aerol.ai MicroVM sandbox API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Aerol AI" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "websocket-client>=1.8.0,<2"
]

# AsyncMicroVM's transport. Optional, so the sync client keeps one
# dependency: pip install "aerolvm-sdk[async]".
[project.optional-dependencies]
async = ["httpx>=0.27,<1"]

# Only the microvm package goes in the wheel. Plain discovery also picked up
# tests/ and examples/ and installed them as top-level packages, where they
# could shadow a user's own "tests" package.
[tool.setuptools.packages.find]
include = ["microvm", "microvm.*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
