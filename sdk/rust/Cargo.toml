[package]
name = "microvm-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Aerol AI"]
description = "A Rust SDK for the Aerol.ai MicroVM sandbox API"
license = "MIT"
repository = "https://github.com/aerol-ai/microvm"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1.2"
