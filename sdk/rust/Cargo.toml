[package]
name = "aerolvm-sdk"
version = "0.3.2"
edition = "2021"
authors = ["Aerol AI"]
description = "A Rust SDK for the Aerol.ai MicroVM sandbox API"
license = "MIT"
repository = "https://github.com/aerol-ai/microvm"

[dependencies]
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1.2"
futures-util = { version = "0.3", features = ["sink"] }
http = "1.3"
tokio = { version = "1.48", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
