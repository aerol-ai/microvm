              version:
                description: |-
                  Version is the AerolVM release every node runs, such as v0.7.2. It is
                  the one place that sets the version on Kubernetes (eng review D6):
                  raising it starts an upgrade, lowering it rolls back.
                pattern: ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$
                type: string
              workerPools:
                description: WorkerPools run the sandboxes, one worker pod per machine.
                items:
                  description: WorkerPoolSpec is one kind of worker machine.
                  properties:
                    decommission:
                      description: DecommissionSpec times a worker's decommission
                        (§10.5).
                      properties:
                        deadline:
                          description: |-
                            Deadline is when what could not move is stopped, counted from the
                            start. Default 45m. On eks-managed pools the deadline and the drain
                            window are at most 14m: a managed node group gives up evicting after
                            15 minutes.
                          type: string
                        drainWindow:
                          description: |-
