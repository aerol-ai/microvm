---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aerolvm-operator
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - pods
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - aerolvm.io
  resources:
  - aerolclusters
  - aerolnodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aerolvm.io
  resources:
  - aerolclusters/status
  - aerolnodes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - karpenter.sh
  resources:
  - nodeclaims
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - servicecidrs
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aerolvm-operator
  namespace: default
rules:
- apiGroups:
  - ""
  resourceNames:
  - kubernetes
  resources:
  - services
  verbs:
  - get
- apiGroups:
  - discovery.k8s.io
  resourceNames:
  - kubernetes
  resources:
  - endpointslices
  verbs:
  - get
