// The root helper's own API (plans/security-gaps-m1-m4.md §3.3).
//
// The agent, sandboxd running as a user with no rights, calls it over
// /run/aerolvm-rootd/sock/root.sock. containerd's own API shares that socket
// and that gRPC server, behind the gate (internal/rootd/gate), so one peer
// check covers both (eng review D3).
//
// Agent N must work with helper N-1 (eng review D5, D22): the helper is
// swapped after the agent, so for a while a new agent talks to the old
// helper. So fields and calls are only ever added, never renumbered,
// retyped or removed, and the agent asks Version what this helper serves
// before it relies on a call.

syntax = "proto3";

package aerolvm.rootd.v1;

option go_package = "github.com/aerol-ai/microvm/internal/rootd/rootdpb";

service RootHelper {
  // Version says which helper this is and what it serves. Every helper
  // serves it, so it is the agent's handshake.
  rpc Version(VersionRequest) returns (VersionResponse);

  // EnsureHost makes sure the host's firewall is set up for sandboxes:
  // bridged traffic through netfilter, the sandboxes' rule chain and its
  // block sets, and the IPv6 fence on the sandboxes' bridge, all from the
  // helper's own settings. It starts the helper's own timer that puts them,
  // and the node guard and floor, back if something takes them away, and
  // answers whether the IPv6 fence covers the sandboxes now.
  rpc EnsureHost(EnsureHostRequest) returns (EnsureHostResponse);

  // The calls below make the files runc, runsc and the containerd shim
  // later open as root: in folders only root can write, so the agent can
  // never swap one for a link between the gate's check and root's open.
  // The agent sends typed values; the helper checks them, writes the files
  // itself and answers with the paths to put in specs. No request names a
  // path or carries a file root would trust. Each call is safe to retry.
  // All but EnsureTaskFIFOs are also safe to repeat: "make sure this
  // exists" or "make sure this is gone". EnsureTaskFIFOs makes fresh FIFOs
  // each time, so a repeat replaces the pair a reader may hold.

  // EnsureHostFiles makes sure a container's hostname, hosts and
  // resolv.conf files (and the egress CA, when asked) exist with this
  // content, and drops an egress CA the request no longer asks for.
  rpc EnsureHostFiles(EnsureHostFilesRequest) returns (EnsureHostFilesResponse);

  // EnsureTaskFIFOs makes fresh stdout and stderr FIFOs for a container's
  // next task, at that container's fixed paths. Call it once per task,
  // before opening them: a task's old readers keep the old FIFOs.
  rpc EnsureTaskFIFOs(EnsureTaskFIFOsRequest) returns (EnsureTaskFIFOsResponse);

  // EnsureRunscConfig makes sure one of the runsc shim configs the helper
  // owns exists. The helper writes its whole content.
  rpc EnsureRunscConfig(EnsureRunscConfigRequest) returns (EnsureRunscConfigResponse);

  // EnsureReadySocket gives the agent's ready socket for a container a
  // name in the helper's folder, for the spec to bind. The agent binds and
  // keeps the socket in its own ready folder, as before; the helper links
  // that socket into its own folder and checks, after linking, that it is
  // a socket the agent owns.
  rpc EnsureReadySocket(EnsureReadySocketRequest) returns (EnsureReadySocketResponse);

  // RemoveContainerFiles makes sure everything the helper made for a
  // container is gone: host files, FIFOs and ready socket names.
  rpc RemoveContainerFiles(RemoveContainerFilesRequest) returns (RemoveContainerFilesResponse);

  // The calls below are the network work of a sandbox on the containerd
  // engine: its named network namespace, its CNI attachment to the
  // sandboxes' bridge and its address. The agent keeps the netns pool's
  // bookkeeping (which slot is whose, in its store) and names a namespace
  // by its pool name; the helper builds the namespace's path itself, runs
  // CNI with its own config and plugins, and touches only namespaces that
  // are empty or attached to its own bridge. Each call is safe to retry
  // and to repeat.

  // EnsureHostNetwork makes sure the host is ready for sandbox networks:
  // IP forwarding on, and the helper's CNI config written when absent. It
  // answers with the sandboxes' address range that config hands out.
  rpc EnsureHostNetwork(EnsureHostNetworkRequest) returns (EnsureHostNetworkResponse);

  // RealizeNetns makes sure a sandbox's network namespace exists, with
  // loopback up, IPv6 off and an address on the sandboxes' bridge, and
  // answers with its path and address. A namespace already realized is
  // answered as it is.
  rpc RealizeNetns(RealizeNetnsRequest) returns (RealizeNetnsResponse);

  // RemoveNetns makes sure a sandbox's network namespace is gone, with its
  // CNI attachment, address lease, NAT chain and connection tracking.
  rpc RemoveNetns(RemoveNetnsRequest) returns (RemoveNetnsResponse);

  // DisableNetnsIPv6 makes sure IPv6 is off inside a realized namespace.
  rpc DisableNetnsIPv6(DisableNetnsIPv6Request) returns (DisableNetnsIPv6Response);

  // NetnsAddrs says whether a namespace exists and lists its IPv4
  // addresses, loopback aside: the address a task started there has.
  rpc NetnsAddrs(NetnsAddrsRequest) returns (NetnsAddrsResponse);

  // The calls below are the host firewall for sandboxes. The agent sends
  // typed values: an address, a sandbox's egress CIDRs, the node ports
  // sandboxes may reach, the node's extra deny floor. The helper checks
  // each, renders every rule itself and touches only rules AerolVM keeps
  // for sandbox addresses. Each call is safe to retry and to repeat.

  // SetNodeGuard makes sure the node guard (the node closed to the
  // sandboxes' range) holds, with these ports open, and puts it back if
  // something took it away.
  rpc SetNodeGuard(SetNodeGuardRequest) returns (SetNodeGuardResponse);

  // SetEgressFloor makes sure the node-wide deny floor holds these
  // networks, plus the cloud metadata endpoints the helper always adds.
  rpc SetEgressFloor(SetEgressFloorRequest) returns (SetEgressFloorResponse);

  // SandboxRules changes one sandbox address's rules.
  rpc SandboxRules(SandboxRulesRequest) returns (SandboxRulesResponse);

  // PrepareSandbox does a create's root work in one call: each part the
  // request lists (see VersionResponse.parts). A helper refuses a request
  // that carries a part, or a field, it does not know, so nothing is ever
  // skipped without a word. The cgroup part comes alone, once the
  // sandbox's task has started: the runtime makes its group with the task,
  // after the namespace and rules of the create's first call. The
  // container's parts (files) come together, named by container_id, just
  // before the container is made, and again before each start.
  rpc PrepareSandbox(PrepareSandboxRequest) returns (PrepareSandboxResponse);

  // ReleaseSandbox undoes PrepareSandbox: the address's rules first, then
  // its namespace and attachment. Its files part, alone and named by
  // container_id, removes everything the helper made for the container.
  rpc ReleaseSandbox(ReleaseSandboxRequest) returns (ReleaseSandboxResponse);

  // The hostname egress gateway's host side (M1 PR 5b). BridgeProbe builds,
  // drives and removes the gateway self-test's probe network on the
  // helper's own bridge; MatchProcess answers which of a sandbox's listed
  // executables holds one connection (per-binary egress rules).
  rpc BridgeProbe(BridgeProbeRequest) returns (BridgeProbeResponse);
  rpc MatchProcess(MatchProcessRequest) returns (MatchProcessResponse);

  // HostPort forwards raw-TCP host ports of this node in the kernel, for
  // ingress proxy routing (plans/ingress-proxy-routing.md §3.5; M1 PR 5b),
  // as sandboxd's hostport.Forwarder does in privilege mode single: sets
  // one port's forward, removes one, or makes the node's set exactly a
  // list. The helper takes only ports of its own host-port range, and
  // hands them only to a leased sandbox address, another node's host port,
  // or sandboxd's own listener.
  rpc HostPort(HostPortRequest) returns (HostPortResponse);

  // The calls below are a sandbox's external storage mounts (M1 PR 8), as
  // sandboxd's mount manager does them in privilege mode single
  // (pkg/mounts). The agent sends the sandbox's mount specs; the helper
  // checks each itself (internal/rootpolicy CheckExternalMounts), builds
  // every mount point (<mounts folder>/<sandbox>/<index>) and every tool
  // argument itself, mounts NFS shares with nosuid and nodev, and runs each
  // FUSE tool as its own normal user with no-new-privs, on a FUSE mount it
  // made. No request names a host path.

  // MountExternal makes sure a sandbox's mounts serve, and answers with
  // their mount points for the container's binds.
  rpc MountExternal(MountExternalRequest) returns (MountExternalResponse);

  // UnmountExternal makes sure a sandbox's mounts are gone: its tools
  // stopped, its mounts unmounted, its folder, key files and caches
  // removed.
  rpc UnmountExternal(UnmountExternalRequest) returns (UnmountExternalResponse);

  // SweepExternalMounts removes the mounts of every sandbox the request
  // does not keep, except those a call is working on.
  rpc SweepExternalMounts(SweepExternalMountsRequest) returns (SweepExternalMountsResponse);

  // ReclaimVolume deletes a deleted platform volume's files on the NFS
  // export of the helper's own settings (SB_PLATFORM_VOLUMES_NFS_*): it
  // mounts the volume's folder in a scratch folder of its own, nosuid,
  // nodev and noexec, empties it without crossing into another mount or
  // following a link, and unmounts it. The source must be one volume's
  // folder of that export, <server>:/<export>/<scope>/<name>.
  rpc ReclaimVolume(ReclaimVolumeRequest) returns (ReclaimVolumeResponse);

  // The calls below are the host-process runtimes' root work (M1 PR 9):
  // V8-isolate group hosts (workerd in its jail), WASM workers and resident
  // hosts. Each host is a process the helper starts in a cgroup of its own,
  // under the helper's own host-process parent, so it outlives both the
  // agent and the helper. The agent names a host by its kind and its id;
  // the helper checks both (internal/rootpolicy), builds every path, picks
  // the binary from its own settings, never from a request, and starts the
  // host as a user with no rights. Each call is safe to retry and to
  // repeat: "make sure this is so".

  // PrepareHost makes sure what a host needs before its process starts
  // exists: a V8 group's jail (its chroot, linked from the helper's base
  // tree, with a run folder the agent writes its config and sockets into).
  rpc PrepareHost(PrepareHostRequest) returns (PrepareHostResponse);

  // SpawnHost makes sure a host runs, and answers with its process. A host
  // that already runs is answered as it is.
  rpc SpawnHost(SpawnHostRequest) returns (SpawnHostResponse);

  // StopHost makes sure a host is gone: every process in its group killed,
  // and what PrepareHost and SpawnHost made removed.
  rpc StopHost(StopHostRequest) returns (StopHostResponse);

  // ListHosts lists the hosts the helper holds anything for, read from the
  // kernel: those whose process runs, and those left with none (pid 0),
  // for the agent's sweep.
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);

  // SetHostLimits changes a running host's limits (a warm V8 group host a
  // tenant claims takes that tenant's).
  rpc SetHostLimits(SetHostLimitsRequest) returns (SetHostLimitsResponse);

  // The calls below are the Firecracker runtime's network and disk work
  // (M1 PR 9b). A VM itself is a host of kind FIRECRACKER: PrepareHost
  // builds its jail and moves the disks the agent built into it, SpawnHost
  // runs the jailer, StopHost kills the VM and removes its jail.

  // EnsureTap makes sure one of the TAP pool's devices is up: made for the
  // jailer's user, with the host's address of its slot, strict reverse
  // path filtering, IPv6 off and the guest's neighbor entry. The helper
  // works the slot's addresses out from the name and its own TAP base; on
  // its first TAP it also puts in the guests' NAT and isolation.
  rpc EnsureTap(EnsureTapRequest) returns (EnsureTapResponse);

  // RemoveTap makes sure one of the pool's TAP devices is gone.
  rpc RemoveTap(RemoveTapRequest) returns (RemoveTapResponse);

  // MakeFilesystem makes an ext4 filesystem in one of a VM's disk files, in
  // its jail's stage folder: the root disk, from a folder of the agent's,
  // or the overlay disk, empty. mkfs.ext4 runs as the agent's own user,
  // seen as root in a user namespace of its own, so the files come out
  // owned by root as in privilege mode single and it can read and write
  // nothing the agent could not.
  rpc MakeFilesystem(MakeFilesystemRequest) returns (MakeFilesystemResponse);

  // The calls below are the Firecracker guests' firewall (M1 PR 14), as
  // sandboxd keeps it in privilege mode single: the guests' own rule chain
  // on the helper's TAP base, its block sets, the node guard and the deny
  // floor for that base, and each guest's rules. The agent sends typed
  // values, as for the containerd firewall above: a guest's address, its
  // egress CIDRs, the node ports guests may reach, the node's extra deny
  // floor. The helper checks each, renders every rule itself, and touches
  // only the guests' own chains. Each call is safe to retry and to repeat.

  // EnsureGuestFirewall makes sure the guests' firewall is set up: the
  // guests' NAT and isolation (as EnsureTap puts them in), their rule chain
  // and block sets, and the floor. It starts the helper's own timer that
  // puts them back if something takes them away.
  rpc EnsureGuestFirewall(EnsureGuestFirewallRequest) returns (EnsureGuestFirewallResponse);

  // SetGuestNodeGuard makes sure the node guard holds for the TAP base,
  // with these ports open. The ports are the ones SetNodeGuard takes.
  rpc SetGuestNodeGuard(SetNodeGuardRequest) returns (SetNodeGuardResponse);

  // SetGuestEgressFloor makes sure the deny floor for the TAP base holds
  // these networks, plus the cloud metadata endpoints the helper always
  // adds.
  rpc SetGuestEgressFloor(SetEgressFloorRequest) returns (SetEgressFloorResponse);

  // GuestRules changes one guest address's rules.
  rpc GuestRules(GuestRulesRequest) returns (GuestRulesResponse);

  // The calls below hand a Firecracker VM's memory and state files and its
  // disks between the agent and the VM's chroot (M1 PR 14b), for stop,
  // start, template snapshots and snapshot loads. The agent names a VM by
  // its sandbox ID and each file by one of a few fixed names; the helper
  // opens every file once, with no link followed, through a handle on a
  // folder it checked, and changes only that file's group and mode. It
  // never gives a file to another owner, and never makes one the agent or
  // the jailer's user can write that the other reads as trusted. Each call
  // is safe to retry and to repeat.

  // ShareFirecrackerFiles links files the agent built in the VM's stage
  // folder into its chroot, read-only for the jailer's user: a snapshot's
  // memory and state, and a template's root disk, which a snapshot load
  // attaches read-only. Each must be the agent's own regular file; it
  // stays the agent's, with the jailer's group and mode 0640. The VM's
  // process must run (a chroot is made again from nothing before it
  // starts).
  rpc ShareFirecrackerFiles(FirecrackerFilesRequest) returns (FirecrackerFilesResponse);

  // HandOutFirecrackerFiles lets the agent's group read files in the VM's
  // chroot that the VM made or writes: a snapshot's memory and state, its
  // disks. Each must be a regular file of the jailer's user with one name
  // (or one the helper shared, which is the agent's already); the helper
  // sets its group to the agent's and its mode to 0640. The agent copies
  // it out, with checks of its own.
  rpc HandOutFirecrackerFiles(FirecrackerFilesRequest) returns (FirecrackerFilesResponse);

  // GrantWasmMounts lends a WASM sandbox's external mounts to the WASM
  // host that serves it (M1 PR 15). A WASM guest reaches a mount through
  // its mount point, opened and passed to its host as a folder. In
  // privilege mode single sandboxd does that as root; in split it cannot
  // reach the helper's mount points, so the helper does. The agent names
  // the sandbox and the host, never a path: the helper asks the host, on
  // the socket it serves the host on, whether it holds that sandbox, and
  // only then opens each of the sandbox's mount points it holds itself,
  // by the path it built, without entering the mount, and passes them
  // over the same socket. Safe to retry and to repeat: a later loan
  // replaces an earlier one.
  rpc GrantWasmMounts(GrantWasmMountsRequest) returns (GrantWasmMountsResponse);
}

message VersionRequest {
  // The agent's build version, for the helper's log.
  string agent_version = 1;
  // The newest API level the agent speaks.
  uint32 agent_api = 2;
}

message VersionResponse {
  // The helper's build version.
  string helper_version = 1;
  // The newest API level the helper speaks.
  uint32 api = 2;
  // What this helper implements: each RootHelper call it serves, by its
  // short name ("EnsureHost"). Version is always served and not listed.
  // A call can be in the service yet missing here (a placeholder, or a
  // VM-only call on Kubernetes); the agent goes by this list.
  repeated string features = 3;
  // The parts of PrepareSandbox and ReleaseSandbox this helper serves
  // ("netns", "firewall", "files", and PrepareSandbox's "cgroup"). The
  // agent sends a part only when it is listed.
  repeated string parts = 4;
  // The host kinds the host-process calls serve ("workerd",
  // "wasm_worker", "wasm_resident"; rootdpb.HostKindName). The agent asks
  // for a kind only when it is listed.
  repeated string hosts = 5;
}

message EnsureHostRequest {}

message EnsureHostResponse {
  // Why the IPv6 fence does not cover the sandboxes' bridge now; empty
  // when it does.
  string ipv6_fence_error = 1;
  // The fence covers the Firecracker guests' TAPs too: set by a helper
  // that serves Firecracker (M1 PR 14). An older helper fences the bridge
  // alone, and the agent then refuses Firecracker creates.
  bool fences_firecracker = 2;
  // Why the IPv6 fence does not cover the guests' TAPs now; empty when it
  // does. Meaningful only with fences_firecracker.
  string firecracker_ipv6_fence_error = 3;
}

// HostEntry is one line of a container's hosts file.
message HostEntry {
  // An IPv4 or IPv6 address, without a zone.
  string address = 1;
  // The names for it, each a host name.
  repeated string names = 2;
}

message EnsureHostFilesRequest {
  // The container the files are for (a sandbox or a warm-pool slot ID).
  string container_id = 1;
  // The hostname file's one line.
  string hostname = 2;
  // The hosts file, one line each, in order.
  repeated HostEntry hosts = 3;
  // resolv.conf: nameserver addresses (no zones), search domains and
  // options, rendered by internal/runtime/resolvconf.
  repeated string nameservers = 4;
  repeated string search = 5;
  repeated string dns_options = 6;
  // The node's egress TLS inspection CA certificate, DER. Empty: none.
  bytes egress_ca_der = 7;
}

message EnsureHostFilesResponse {
  string hostname_path = 1;
  string hosts_path = 2;
  string resolv_conf_path = 3;
  // Empty when the request had no egress CA.
  string egress_ca_path = 4;
}

message EnsureTaskFIFOsRequest {
  string container_id = 1;
}

message EnsureTaskFIFOsResponse {
  // Root's FIFOs, readable by the agent's group: the shim writes, the
  // agent reads.
  string stdout_path = 1;
  string stderr_path = 2;
}

// RunscConfig names a runsc shim config the helper writes.
enum RunscConfig {
  RUNSC_CONFIG_UNSPECIFIED = 0;
  // Every gVisor sandbox: host-uds=open, for the ready socket.
  RUNSC_CONFIG_DEFAULT = 1;
  // A gVisor sandbox restored from a move: the default flags, and
  // aerolvm-runsc as the runsc the shim runs.
  RUNSC_CONFIG_RESTORE = 2;
}

message EnsureRunscConfigRequest {
  RunscConfig config = 1;
}

message EnsureRunscConfigResponse {
  string path = 1;
}

message EnsureReadySocketRequest {
  string container_id = 1;
  // The ready socket's nonce (hex) for a create's socket, which the agent
  // names <container_id>.<nonce>.sock; empty for a warm-pool slot's park
  // socket, <container_id>.sock.
  string nonce = 2;
}

message EnsureReadySocketResponse {
  string path = 1;
}

message RemoveContainerFilesRequest {
  string container_id = 1;
}

message RemoveContainerFilesResponse {}

// HelperUnavailable marks a call that failed because the agent's client
// could not reach the helper. It never crosses the socket: the client adds
// it to the failed call's gRPC status, because containerd's Go client
// rebuilds every error from the status and keeps only details that are
// errors (internal/rootclient). In Go it is an error that matches
// ErrHelperUnavailable.
message HelperUnavailable {}

// HelperUnsupported marks, the same way, a call that failed because the
// helper is older than the agent. reason says which helper and what to do
// (upgrade it). In Go it is an error that matches ErrHelperUnsupported.
message HelperUnsupported {
  string reason = 1;
}

// HelperRefused marks a call the helper or its containerd gate refused
// because the request broke the helper's rules (eng review D9). Unlike the
// two marks above it crosses the socket: the helper adds it to the refused
// call's status, with the status's usual code. The agent only sends what
// its own code built, so a refusal means drift or a broken agent, and the
// agent's client records each one (internal/rootclient). In Go it is an
// error that matches ErrHelperRefused.
message HelperRefused {
  // The rule's short, fixed code ("method_not_allowed", "mount"), fit for
  // a metric label.
  string reason = 1;
}

message EnsureHostNetworkRequest {}

message EnsureHostNetworkResponse {
  // The IPv4 range the helper's CNI config hands sandboxes, as a prefix
  // ("10.88.0.0/16").
  string subnet = 1;
}

message RealizeNetnsRequest {
  // The namespace's netns-pool name: a sandbox, slot or warm-park ID. It
  // is also the CNI container ID its address lease and NAT chain are
  // keyed by.
  string netns_name = 1;
}

message RealizeNetnsResponse {
  // The namespace, for the sandbox's spec: built by the helper.
  string netns_path = 1;
  // The sandbox's IPv4 address on the bridge.
  string container_ip = 2;
}

message RemoveNetnsRequest {
  string netns_name = 1;
  // The address the pool recorded for the namespace, whose NAT chain and
  // connection tracking go with it. Empty when none was recorded. It must
  // be a sandbox address in the helper's range.
  string container_ip = 2;
}

message RemoveNetnsResponse {}

message DisableNetnsIPv6Request {
  string netns_name = 1;
}

message DisableNetnsIPv6Response {}

message NetnsAddrsRequest {
  string netns_name = 1;
}

message NetnsAddrsResponse {
  // Whether a namespace by that name exists.
  bool exists = 1;
  // Its IPv4 addresses, loopback aside, in the kernel's link order.
  repeated string ipv4 = 2;
}

// NodePort is one port on the node that sandboxes may reach.
message NodePort {
  // "tcp" or "udp".
  string proto = 1;
  uint32 port = 2;
  // One node address (IPv4), or empty for every address.
  string dst = 3;
}

message SetNodeGuardRequest {
  repeated NodePort allow = 1;
}

message SetNodeGuardResponse {
  // The guard was missing and was put back.
  bool repaired = 1;
}

message SetEgressFloorRequest {
  // The node's extra deny floor: networks or addresses, IPv4 or IPv6.
  repeated string cidrs = 1;
}

message SetEgressFloorResponse {
  bool repaired = 1;
}

// SandboxRulesOp is one change to a sandbox address's rules.
enum SandboxRulesOp {
  SANDBOX_RULES_OP_UNSPECIFIED = 0;
  SANDBOX_RULES_OP_BLOCK_EGRESS = 1;
  SANDBOX_RULES_OP_LIFT_BLOCK_EGRESS = 2;
  SANDBOX_RULES_OP_CLEAR_BLOCK_EGRESS = 3;
  SANDBOX_RULES_OP_BLOCK_INGRESS = 4;
  SANDBOX_RULES_OP_CLEAR_BLOCK_INGRESS = 5;
  SANDBOX_RULES_OP_APPLY_EGRESS_POLICY = 6;
  SANDBOX_RULES_OP_CLEAR_EGRESS_POLICY = 7;
  SANDBOX_RULES_OP_HOLD_EGRESS = 8;
  SANDBOX_RULES_OP_CLEAR_HOLD_EGRESS = 9;
}

message SandboxRulesRequest {
  // The sandbox's address: one the helper's CNI leased to a sandbox for a
  // change that restricts or opens traffic; any sandbox address for a
  // clear.
  string container_ip = 1;
  SandboxRulesOp op = 2;
  // The egress policy's networks, for the two policy ops.
  repeated string allow_cidrs = 3;
  repeated string deny_cidrs = 4;
}

message SandboxRulesResponse {
  // For a block: the rule was not there and was put in.
  bool inserted = 1;
}

// SandboxFirewall is a create's host rules.
message SandboxFirewall {
  bool block_all_egress = 1;
  repeated string allow_cidrs = 2;
  repeated string deny_cidrs = 3;
}

// SandboxCgroup names a started container whose group the helper makes
// the kernel's whole out-of-memory choice (part "cgroup"; finding F10 of
// the Kubernetes plan): memory.oom.group 1, so one out-of-memory kill takes
// every process in it, and OOM score 500 on each of them, so the kernel
// picks a sandbox before the machinery (-999).
message SandboxCgroup {
  // The containerd container: a sandbox's or a warm-pool slot's ID. The
  // helper builds the group's path itself, under its own cgroup parent
  // (SB_CONTAINERD_CGROUP_PARENT); no request names a path.
  string container_id = 1;
}

// HostNaming is what a container's hostname, hosts and resolv.conf files
// hold, as EnsureHostFiles writes them.
message HostNaming {
  // The hostname file's one line.
  string hostname = 1;
  // The hosts file, one line each, in order.
  repeated HostEntry hosts = 2;
  // resolv.conf: nameserver addresses (no zones), search domains and
  // options, rendered by internal/runtime/resolvconf.
  repeated string nameservers = 3;
  repeated string search = 4;
  repeated string dns_options = 5;
}

// ContainerSetup asks for the files runc, runsc and the containerd shim
// open as root because a container names them (part "files"): what
// EnsureHostFiles, EnsureTaskFIFOs, EnsureReadySocket and EnsureRunscConfig
// make, in one part of a create's or a start's call. The agent sends typed
// values; the helper makes each file in its own folders and answers with
// the paths for the spec and the task.
message ContainerSetup {
  // The host files' values. Absent: none written.
  HostNaming naming = 1;
  // Fresh stdout and stderr FIFOs for the container's next task.
  bool task_fifos = 2;
  // The nonce of the ready socket the agent bound for this container
  // (<container_id>.<nonce>.sock in its ready folder); empty: none.
  string ready_nonce = 3;
  // The runsc shim config the container's runtime options name;
  // UNSPECIFIED: none.
  RunscConfig runsc_config = 4;
  // The toolbox binary the spec binds into the sandbox: the helper's
  // root-owned copy of the agent's, or the operator's own.
  bool toolbox = 5;
}

// SandboxFilePaths are the paths of what a files part made; each is empty
// when the part did not ask for it.
message SandboxFilePaths {
  string hostname_path = 1;
  string hosts_path = 2;
  string resolv_conf_path = 3;
  string stdout_path = 4;
  string stderr_path = 5;
  string ready_socket_path = 6;
  string runsc_config_path = 7;
  string toolbox_path = 8;
}

// ImageUser asks which user a container's image runs as (part
// "image_user"): its config's USER, resolved against the image's own
// /etc/passwd and /etc/group as containerd's oci.WithImageConfig does.
// The image is the one in the container's root filesystem snapshot, whose
// key is the container's ID; the helper reads it from containerd itself.
message ImageUser {
  // The image config's USER; empty when it names none.
  string user = 1;
}

// ImageUserAnswer is what an image's user resolves to, for the spec's
// process: what oci.WithImageConfig would set.
message ImageUserAnswer {
  uint32 uid = 1;
  uint32 gid = 2;
  repeated uint32 additional_gids = 3;
}

// DiskQuota asks for a hard limit on a container's writable layer (part
// "disk_quota"): an XFS project of its own, from AerolVM's fixed range,
// over the snapshot's own folder. The helper finds the folder from
// containerd's answer for the container's snapshot.
message DiskQuota {
  uint64 bytes = 1;
}

message PrepareSandboxRequest {
  // The netns-pool slot the sandbox gets.
  string netns_name = 1;
  // Every part this request carries.
  repeated string parts = 2;
  // The slot's address, as the pool recorded it, when the request has no
  // netns part (a warm slot, already realized).
  string container_ip = 3;
  // Part "firewall".
  SandboxFirewall firewall = 4;
  // Part "cgroup", which comes alone: no netns_name, container_ip or
  // firewall with it.
  SandboxCgroup cgroup = 5;
  // The container the container's parts are for: a sandbox's or a
  // warm-pool slot's ID. Those parts come together, with no netns_name,
  // container_ip, firewall or cgroup.
  string container_id = 6;
  // Part "files".
  ContainerSetup setup = 7;
  // Part "image_user".
  ImageUser image_user = 8;
  // Part "disk_quota".
  DiskQuota disk_quota = 9;
}

message PrepareSandboxResponse {
  // Part "netns": the namespace and the address CNI gave it.
  string netns_path = 1;
  string container_ip = 2;
  // Part "firewall": a block-all rule was put in (not already there).
  bool block_inserted = 3;
  // Part "files".
  SandboxFilePaths files = 4;
  // Part "image_user".
  ImageUserAnswer image_user = 5;
}

message ReleaseSandboxRequest {
  string netns_name = 1;
  // The address the pool recorded for the slot; empty when none was.
  string container_ip = 2;
  // Every part this request carries: "firewall" clears every rule AerolVM
  // keeps for the address, "netns" removes the namespace, and "files",
  // which comes alone, removes the container's files.
  repeated string parts = 3;
  // Part "files": the container whose files go.
  string container_id = 4;
}

message ReleaseSandboxResponse {}

// BridgeProbeOp is one step of the gateway self-test's probe network, as
// sandboxd runs it in single mode (egress.ProbeNet).
enum BridgeProbeOp {
  BRIDGE_PROBE_OP_UNSPECIFIED = 0;
  // Build the probe network: a namespace joined to the bridge by a veth,
  // with the slot's reserved link-local source address.
  BRIDGE_PROBE_OP_SETUP = 1;
  // Send one DNS query and open one TCP connection from inside it.
  BRIDGE_PROBE_OP_SEND = 2;
  // Remove it.
  BRIDGE_PROBE_OP_CLOSE = 3;
}

message BridgeProbeRequest {
  BridgeProbeOp op = 1;
  // The probe slot: the helper derives the probe's names and its source
  // address (169.254.250.<slot+1>) from it, and always probes its own
  // bridge, from its own CNI config.
  uint32 slot = 2;
}

message BridgeProbeResponse {
  // SETUP: the bridge has no link yet (no sandbox has been attached).
  bool bridge_absent = 1;
  // SETUP: the bridge cannot pass the redirect (IPv6 on it, or bridged
  // traffic not going through netfilter); the reason.
  string not_ready = 2;
  // SEND: what failed sending, if anything (the gateway's view decides).
  string send_error = 3;
}

message MatchProcessRequest {
  // The sandbox's process, as sandboxd's record of the sandbox names it.
  uint32 pid = 1;
  // The connection, seen from inside the sandbox: ip:port each.
  string local = 2;
  string remote = 3;
  // The executables the sandbox's own rules list.
  repeated string paths = 4;
}

message MatchProcessResponse {
  // The listed paths whose process holds the connection.
  repeated string matched = 1;
  // No process holds it (it closed, or the sandbox cannot be traced).
  bool not_found = 2;
}

enum HostPortOp {
  HOST_PORT_OP_UNSPECIFIED = 0;
  // Make one port's forward exactly forwards[0], whatever forwarded it
  // before (an earlier helper's rules included).
  HOST_PORT_OP_SET = 1;
  // Stop forwarding host_port and cut its tracked connections.
  HOST_PORT_OP_REMOVE = 2;
  // Make the node's forwards exactly forwards (none: no forwarding).
  HOST_PORT_OP_RECONCILE = 3;
}

// HostPortKind is where a host port is handed on; each has its own rule.
enum HostPortKind {
  HOST_PORT_KIND_UNSPECIFIED = 0;
  // A sandbox on this node: DNAT to address:port, an address the helper's
  // CNI leased to a slot.
  HOST_PORT_KIND_SANDBOX = 1;
  // A sandbox's owner node (an ingress node's hop): DNAT to another
  // node's address and host port, masqueraded so the owner replies here.
  HOST_PORT_KIND_PEER = 2;
  // sandboxd's own listener (a stopped sandbox's wake, a WASM or isolate
  // mediator): REDIRECT to port, which must be the helper's
  // SB_HOSTPORT_REDIRECT_PORT. No address.
  HOST_PORT_KIND_REDIRECT = 3;
}

message HostPortForward {
  uint32 host_port = 1;
  HostPortKind kind = 2;
  string address = 3;
  uint32 port = 4;
}

message HostPortRequest {
  HostPortOp op = 1;
  // SET: one. RECONCILE: the whole set, each host port once.
  repeated HostPortForward forwards = 2;
  // REMOVE: the port.
  uint32 host_port = 3;
}

message HostPortResponse {
  // RECONCILE: the host ports not forwarded because their sandbox address
  // is no longer leased (the sandbox went while the list was made).
  repeated uint32 skipped = 1;
}

// MountExternalMode is what MountExternal does with mounts that already
// serve, as pkg/mounts.Manager's calls of the same names do.
enum MountExternalMode {
  MOUNT_EXTERNAL_MODE_UNSPECIFIED = 0;
  // A create's: refused when the sandbox's mounts are established.
  MOUNT_EXTERNAL_MODE_CREATE = 1;
  // A start's or a reconcile's: take over what still serves as it runs,
  // and mount the rest.
  MOUNT_EXTERNAL_MODE_REESTABLISH = 2;
  // A running sandbox whose stored options the allow lists now refuse
  // (pkg/mounts.Manager.KeepLive): take over what still serves, as it
  // runs, and start nothing. Its specs are checked against the lists a
  // running mount may keep.
  MOUNT_EXTERNAL_MODE_KEEP_LIVE = 3;
}

// ExternalMount is one mount spec (pkg/models.MountSpec).
message ExternalMount {
  string type = 1;
  // Where the mount lands inside the sandbox.
  string target = 2;
  string source = 3;
  map<string, string> options = 4;
  bool read_only = 5;
  // The keys the type's tool reads, and no other. The helper hands them
  // to the tool as a sealed in-memory file (s3, rclone) or a key file of
  // the tool's own (sshfs); never on a command line, in an environment or
  // in a log. They are not sealed again for the helper: the socket is
  // root's and the agent's, and the agent, which holds the node's cipher,
  // already reads them in the clear (plan eng review R9).
  map<string, string> credentials = 6;
}

message MountExternalRequest {
  string sandbox_id = 1;
  MountExternalMode mode = 2;
  // In the sandbox's order: a mount's index is its place here.
  repeated ExternalMount mounts = 3;
}

// MountBind is one mount's bind into the sandbox.
message MountBind {
  // The mount point, built by the helper: <mounts folder>/<sandbox>/<index>.
  string host_path = 1;
  string target = 2;
  bool read_only = 3;
}

message MountExternalResponse {
  // CREATE and REESTABLISH: every mount's bind, in the request's order.
  // KEEP_LIVE: the kept mounts' binds.
  repeated MountBind binds = 1;
  // KEEP_LIVE: the mounts taken over (by index), and those that were not
  // served and stay unmounted.
  repeated uint32 kept = 2;
  repeated uint32 gone = 3;
  // KEEP_LIVE: the helper already held the sandbox's mounts.
  bool already = 4;
}

message UnmountExternalRequest {
  string sandbox_id = 1;
  // Discard (pkg/mounts.Manager.Discard): leave a mount set another call
  // is making alone.
  bool discard = 2;
}

message UnmountExternalResponse {
  // Discard: there was something to tear down.
  bool had = 1;
}

message SweepExternalMountsRequest {
  // The sandboxes whose mounts stay.
  repeated string keep = 1;
}

message SweepExternalMountsResponse {}

message ReclaimVolumeRequest {
  // The volume's NFS source as it was stored: <server>:/<export>/<scope>/<name>.
  string source = 1;
}

message ReclaimVolumeResponse {}

// HostKind is what a host process is. The helper serves a kind only when
// its settings name what that kind runs.
enum HostKind {
  HOST_KIND_UNSPECIFIED = 0;
  // A V8-isolate group: workerd, in a jail the helper builds, as the jail
  // user. The id is the group key.
  HOST_KIND_WORKERD = 1;
  // A WASM worker: one sandbox's module, or one warm-pool slot's. The id
  // is the sandbox or slot.
  HOST_KIND_WASM_WORKER = 2;
  // A WASM resident host: many sandboxes of one module. The id is the
  // host's key.
  HOST_KIND_WASM_RESIDENT = 3;
  // A Firecracker VM, run by the jailer as the jailer's user. The id is
  // the sandbox ID (M1 PR 9b).
  HOST_KIND_FIRECRACKER = 4;
}

// HostLimits are a host's cgroup limits. Zero on an axis is no limit, which
// only an unclaimed warm host has.
message HostLimits {
  // CPU, in thousandths of a CPU.
  uint32 cpu_millis = 1;
  uint64 memory_mb = 2;
  uint32 pids = 3;
}

message PrepareHostRequest {
  HostKind kind = 1;
  string id = 2;
  // FIRECRACKER only.
  FirecrackerHostSpec firecracker = 3;
}

message PrepareHostResponse {
  // WORKERD: the group's run folder, built by the helper inside its jail,
  // which the agent writes the group's config and binds its sockets in.
  // FIRECRACKER: the jailer's chroot, where the VM's sockets appear.
  string run_dir = 1;
  // FIRECRACKER: the folder of the agent's own the VM's disks are built
  // in, beside the chroot.
  string stage_dir = 2;
}

// FirecrackerHostSpec is what PrepareHost moves into a VM's jail.
message FirecrackerHostSpec {
  // Disk files the agent built in the stage folder ("rootfs.ext4",
  // "overlay.ext4") to move into the chroot for the jailer's user. Each
  // must be the agent's own file, with one name; the helper links it in
  // and gives it to the jailer's user.
  repeated string stage = 1;
}

// WasmHostSpec is what a WASM host is started with. The helper builds every
// folder and file the host opens as root from its own settings; the agent
// names only a cache and the worker settings it computes at run time.
message WasmHostSpec {
  // The compile cache the host may write (one owner's, or one warm slot's),
  // as a name under the cache root: "operator", "owner-<hash>",
  // "slots/<hash>/cache". Empty: no cache.
  string cache = 1;
  // Worker settings sandboxd computes at run time (the audit ingest's port,
  // the node ports guests may reach, the private ranges), each NAME=value
  // by its environment name. The helper takes only names from its own
  // list, none of them a path.
  repeated string env = 2;
}

message SpawnHostRequest {
  HostKind kind = 1;
  string id = 2;
  // WORKERD.
  HostLimits limits = 3;
  // WASM_WORKER and WASM_RESIDENT.
  WasmHostSpec wasm = 4;
}

message SpawnHostResponse {
  uint32 pid = 1;
  // When the process started, in clock ticks after boot: with the pid, it
  // names the process for good.
  uint64 start_ticks = 2;
  // The host already ran; nothing was started.
  bool already = 3;
  // WASM_WORKER and WASM_RESIDENT: the socket the host serves, which the
  // helper made in its own folder for the agent's group alone.
  string socket = 4;
}

message StopHostRequest {
  HostKind kind = 1;
  string id = 2;
}

message StopHostResponse {
  // There was something to stop or remove.
  bool had = 1;
}

message ListHostsRequest {
  // UNSPECIFIED lists every kind this helper serves.
  HostKind kind = 1;
}

// RunningHost is one host the helper holds anything for. pid is 0 when its
// process is gone and only its group or jail is left.
message RunningHost {
  HostKind kind = 1;
  string id = 2;
  uint32 pid = 3;
  uint64 start_ticks = 4;
}

message ListHostsResponse {
  repeated RunningHost hosts = 1;
}

message SetHostLimitsRequest {
  HostKind kind = 1;
  string id = 2;
  HostLimits limits = 3;
}

message SetHostLimitsResponse {}

message EnsureTapRequest {
  // The device's name: fctap<slot index>.
  string name = 1;
  // A snapshot's guest vsock CID (M1 PR 14b), when the VM restores one:
  // the guest keeps the MAC the snapshot froze, which the helper works
  // out from this CID for the TAP's neighbor entry. 0: the slot's own.
  // The agent sends it only to a helper that lists
  // ShareFirecrackerFiles.
  uint32 guest_cid = 2;
}

message EnsureTapResponse {
  // The slot's addresses, as the helper worked them out, for the agent to
  // check against its own pool.
  string cidr = 1;
  string host_ip = 2;
  string guest_ip = 3;
  uint32 vsock_cid = 4;
}

message RemoveTapRequest {
  string name = 1;
}

message RemoveTapResponse {}

message MakeFilesystemRequest {
  // The VM's sandbox ID and the disk file in its stage folder
  // ("rootfs.ext4", "overlay.ext4").
  string id = 1;
  string name = 2;
  // A folder whose files become the filesystem's (mkfs.ext4 -d); empty
  // for an empty filesystem in a file the agent made (the overlay).
  string source = 3;
  // The filesystem's size in MiB, with a source.
  uint64 size_mib = 4;
}

message MakeFilesystemResponse {}

message EnsureGuestFirewallRequest {}

message EnsureGuestFirewallResponse {}

message GuestRulesRequest {
  // The guest's address: the guest end of one of the TAP pool's slots, as
  // the helper lays the pool out from its own TAP base.
  string guest_ip = 1;
  SandboxRulesOp op = 2;
  // The egress policy's networks, for the two policy ops.
  repeated string allow_cidrs = 3;
  repeated string deny_cidrs = 4;
}

message GuestRulesResponse {
  // For a block: the rule was not there and was put in.
  bool inserted = 1;
}

message FirecrackerFilesRequest {
  // The VM's sandbox ID.
  string id = 1;
  // The files, by name: "snapshot.memory", "snapshot.state",
  // "rootfs.ext4", "overlay.ext4" (each call takes the names it allows).
  repeated string names = 2;
}

message FirecrackerFilesResponse {}

message GrantWasmMountsRequest {
  // The sandbox whose mounts are lent.
  string sandbox_id = 1;
  // The host that serves it: WASM_WORKER (its own worker, or the warm-pool
  // slot's it took) or WASM_RESIDENT, by the id SpawnHost named it.
  HostKind kind = 2;
  string host_id = 3;
}

message GrantWasmMountsResponse {
  // How many mount points went to the host; 0 when the sandbox has none
  // here.
  uint32 granted = 1;
}
