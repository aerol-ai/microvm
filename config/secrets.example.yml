# Template for config/secrets.yml — the shared SoT for cluster SECRETS that
# Terraform and Ansible both read. Real-value sibling is gitignored.
#
# Bootstrap on a fresh checkout:
#   cp config/secrets.example.yml config/secrets.yml
#   # then fill in the values below.
#
# Keep keys empty if you are not using the matching feature in cluster.yml.
# Setting these values without flipping mirror.host / auto_import.enabled in
# cluster.yml is a no-op.

# --- Cluster identity ------------------------------------------------------
# pat_token is the shared SB_PAT_TOKEN every node uses for operator/SDK API
# auth and cluster-internal forwarding. Generate one with
#   openssl rand -hex 32 | sed 's/^/avm_/'
# or whatever scheme you use for cluster secrets.
cluster:
  pat_token: ""

# --- AOCR (authenticated mirror + auto-import) ------------------------------
# upstream_wrap_key  Base64-encoded 32-byte AES-GCM key from aocr secrets/
#                    upstream_wrap_key. Empty = wrapping disabled.
# cluster_pat        Bearer token from aocr secrets/internal_api_token.
#                    Required when cluster.yml has auto_import.enabled = true.
aocr:
  upstream_wrap_key: ""
  cluster_pat:       ""

# --- Cloudflare DNS --------------------------------------------------------
# api_token is the Cloudflare API token Terraform uses to manage DNS records
# for the cluster (apex + optional wildcard) and that Caddy reuses for
# Let's Encrypt DNS-01 challenges. Required: Zone:DNS:Edit on the target zone.
# Add Zone:Read if you want auto-zone-lookup (leaving cloudflare_zone_id unset
# in config/terraform.tfvars).
#
# This is a Terraform-provider credential, but it's a real secret — it must
# never sit in config/terraform.tfvars (which is gitignored but still ends up
# in plaintext on the operator's disk alongside non-secret topology values).
cloudflare:
  api_token: ""

# --- Fleet control plane ---------------------------------------------------
# token is the fleet credential (avm_<32hex>) sandboxd presents to the managed
# control plane as a Bearer. Required when cluster.yml has
# fleet_control_plane.enabled = true; leave empty otherwise. Kept under its own
# top-level `fleet` key (NOT `fleet_control_plane`) so loading secrets.yml
# never overrides the non-secret fleet_control_plane block in cluster.yml.
# Generate with: openssl rand -hex 16 | sed 's/^/avm_/'
fleet:
  token: ""

# --- Integration-test persistent Caddy cert store --------------------------
# Populated by `make integration-cert-store-init` — you don't fill this in by
# hand. It points the integration harness at ONE long-lived S3 bucket (BYO
# shared cert storage) that lives outside per-scenario Terraform state, so a
# leased-domain wildcard cert issued on one run is fetched from S3 on the next
# instead of re-issued against Let's Encrypt. The domain pool is finite, so
# each domain issues exactly once and is reused thereafter.
#
# bucket/region/prefix are not secret; encryption_key IS — certmagic-s3
# encrypts the stored cert+key bytes with it, so losing or rotating it orphans
# every stored cert (unreadable → full re-issue). Leave the whole block empty
# if you don't run the live integration suite; the harness then falls back to
# each scenario's own (ephemeral) cert behaviour.
caddy_cert_store:
  bucket:         ""
  region:         ""
  prefix:         "itest-caddy-certs"
  encryption_key: ""
