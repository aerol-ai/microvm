# Single source of truth for sandboxd operational env vars across the cluster.
#
# Both Terraform (./Terraform/) and Ansible (./Ansible/) read this file and
# render its values into /etc/sandboxd/cluster.env on every node. Edit here,
# then apply with EITHER tool — they produce the same env file contents:
#
#   - scripts/terraform.sh apply                    # day-0 / re-provision
#   - ansible-playbook playbooks/configure-ops.yml  # day-2 / live rollout
#
# DO NOT put values in config/terraform.tfvars or Ansible local.yml that
# this file already controls — the two tools would disagree on which to
# write and the last one to run would silently clobber the other.
#
# Secrets split:
#   - All cluster secrets (cluster.pat_token, cloudflare.api_token, aocr.*,
#     fleet.token) live in ./secrets.yml, a parallel shared SoT also read
#     by both Terraform and Ansible. Gitignored — bootstrap with
#     `cp config/secrets.example.yml config/secrets.yml`.
#   - Terraform-only inputs that Ansible never sees (AWS placement,
#     instance sizing, the node list, firecracker artifact URLs, the
#     caddy shared-cert-storage block) live in ./terraform.tfvars
#     (also gitignored; example in ./terraform.tfvars.example).
# None of those keys belong in this file.

# --- Cluster identity / public ingress ------------------------------------
# domain_name is the hostname advertised as the cluster ingress. Both an A
# record (this name) and a wildcard *.<name> are created and pointed at every
# ingress-bearing node's public IP. Set empty to skip TLS and run in IP/path
# mode (Terraform-only; Ansible day-2 doesn't manage DNS).
#
# acme_email is the contact registered with Let's Encrypt — receives
# cert-expiry warnings and is the identity LE uses for rate-limit triage.
# Strongly recommended in domain mode; empty creates an anonymous ACME
# account with no notifications.
ingress:
  domain_name: "vm.aerol.cloud"
  acme_email:  "sumansaurabh@aerol.ai"
  enable_custom_domains: true
  custom_domain_txt_prefix: "_aerol-verify"
  custom_domain_txt_value_prefix: "aerol-verify="

# --- OTEL exporter --------------------------------------------------------
# Enable by setting metrics_endpoint and/or traces_endpoint. The *_enabled
# flags are auto-promoted to true when the matching endpoint is set, so you
# rarely need to flip them by hand.
otel:
  metrics_enabled: false
  metrics_endpoint: ""
  metrics_interval: "30s"
  traces_enabled: false
  traces_endpoint: ""
  traces_sample_ratio: 0.05
  service_name: "sandboxd"

# --- Docker image pull storm controls -------------------------------------
image_pull:
  max_concurrent: 4
  failure_backoff: "30s"

# --- Image GC: whitelist of refs the janitors must never delete -----------
# Three match shapes:
#   - exact ref                ("alpine:latest" — only that tag survives)
#   - repo, tag/digest agnostic ("ubuntu" — every tag and digest of ubuntu)
#   - registry/org prefix      (trailing "/" — "ghcr.io/myorg/" matches all)
# Joined with "," when rendered as SB_IMAGE_GC_WHITELIST.
image_gc:
  whitelist:
    - "sumanrocs/"

# --- Image GC: janitor cadence (built-image + pending-destroy sweeps) -----
# Both sweeps share these knobs. Default TTL 24h trades disk for warm-start
# latency: shorter values reclaim disk faster but re-pull on destroy/recreate
# cycles inside the window.
image_build_gc:
  enabled: true
  interval: "10m"
  ttl: "24h"

# --- Platform volumes ------------------------------------------------------
# Operator-backed named persistent volumes. Disabled by default; integration
# scenarios that advertise `platform-volumes` enable this block against their
# throwaway S3 bundle bucket so the live suite exercises real mounts without
# requiring a long-lived operator bucket.
platform_volumes:
  enabled: false
  backend: "s3"
  max_per_tenant: 0
  reclaim_interval: "5m"
  reclaim_mount_root: "/var/lib/aerolvm/volume-reclaim"
  reclaim_concurrency: 8
  s3_bucket: ""
  s3_prefix: "volumes"
  s3_region: ""
  s3_endpoint: ""
  s3_access_key_id: ""
  s3_secret_access_key: ""
  nfs_server: ""
  nfs_export: ""
  nfs_options: ""

# --- Docker warm container pool (park + adopt) ----------------------------
# Pre-creates and boots default-shaped containers for the pinned images so an
# eligible create adopts a ready container instead of paying the Docker
# engine's create+start (~280ms on t3.medium). Off by default; requires the
# readiness socket (SB_DOCKER_READY_SOCKET_ENABLED, on by default). Each
# parked slot holds a default-shaped capacity reservation, so depth × images
# must fit the node alongside real sandboxes — the refill gate keeps one
# default-shaped guard band free. See plans/docker-warm-pool.md.
docker:
  pool:
    enabled: false
    # Warm slots kept per pinned image.
    depth: 2
    # Images warmed from daemon start. Empty pins alpine:3.20. Requests for
    # other images self-warm on miss (LRU-capped by max_images).
    images: []
    max_images: 8
    idle_ttl: "15m"
    refill_interval: "5s"

# --- Container engine (dockerd vs native containerd) -----------------------
# Default containerd: server deployments (this config → Terraform + Ansible) run
# the native containerd engine — the target end-state of the docker→containerd
# migration. Set to "docker" to keep a legacy dockerd host. The local install
# (scripts/install.sh) is the one exception — it stays docker unless run with
# --with-containerd-engine. Terraform/Ansible install the CNI plugins under
# /opt/cni/bin when this is containerd.
container_engine: "containerd" # containerd (default) | docker
containerd:
  socket: "/run/containerd/containerd.sock"
  namespace: "aerolvm"
  cni_plugin_dir: "/opt/cni/bin"
  native_netns_pool_enabled: true

# --- Firecracker runtime bootstrap ---------------------------------------
# Host-level Firecracker enablement is opt-in. The bootstrap path must
# install the runtime binaries and provide a kernel image at the configured
# path, plus <kernel_path>.config with CONFIG_VMGENID=y, before sandboxd
# starts with SB_ENABLE_FIRECRACKER=true.
firecracker:
  enabled: false
  kernel_path: "/var/lib/sandboxd/firecracker/vmlinux"

# --- WASM runtime + module distribution -----------------------------------
# enabled=true turns on the WASM/WASI runtime. registry_allowlist is the set
# of registry hosts an oci:// module_ref may pull from (empty = deny all
# remote pulls — the SSRF-safe default; list AOCR to allow BYO modules).
# standard_modules pre-stages curated language-interpreter modules on every
# node (the fleet-wide reserved-keyword contract): each entry's .wasm is
# fetched into modules_dir and exposed as `module_ref: "<alias>"`. push_host
# enables the stateless BYO upload proxy (POST /v1/wasm-modules/push); empty
# disables it.
wasm:
  enabled: false
  modules_dir: "/var/lib/sandboxd/wasm/modules"
  cache_dir: "/var/lib/sandboxd/wasm/cache"
  # Warm-worker pool (Phase 5): pre-spawns workers with the standard modules
  # already loaded + compiled, so a create acquires a ready worker instead of
  # paying the cold compile — which for CPython-on-wasm is ~10s on a small node.
  # On by default (matches sandboxd SB_WASM_POOL_* defaults). Disable on
  # memory-constrained nodes via pool.enabled: false.
  # depth_default = warm slots kept per module digest.
  pool:
    enabled: true
    depth_default: 2
  registry_allowlist: "aocr.aerol.ai"
  pull_timeout: "60s"
  push_host: ""
  # registry login used only to pull the standard modules below (system
  # identity). Tenant BYO pulls/pushes use per-request credentials, never this.
  registry_username: ""
  registry_pat_path: ""
  # Curated standard modules. alias is the reserved keyword tenants reference
  # (module_ref: "<alias>"); source is "url" or "oci"; ref is the URL or oci
  # ref; digest is the sha256 the staging step verifies before the module goes
  # live. Filename is "<alias>.wasm" under modules_dir. Run
  # `ansible-playbook playbooks/stage-wasm-modules.yml` after editing this list.
  #
  # To populate it: grab (or build) a core-wasip1 .wasm, push it to AOCR under
  # the protected wasm/std/* namespace (reaper-exempt, pull-only for tenants),
  # capture its digest, and uncomment an entry below.
  #
  #   oras push aocr.aerol.ai/wasm/std/python:3.12 python.wasm:application/wasm
  #   sha256sum python.wasm
  #
  # Public prebuilt runtimes you can source from instead of building:
  #   Python     https://github.com/vmware-labs/webassembly-language-runtimes (wasi builds)
  #   JavaScript https://github.com/bytecodealliance/javy (qjs/quickjs wasm)
  standard_modules: []
  #  - alias: python
  #    source: oci
  #    ref: "aocr.aerol.ai/wasm/std/python:3.12"
  #    digest: "sha256:<sha256sum of the pushed python.wasm>"
  #  - alias: javascript
  #    source: url
  #    ref: "https://example.com/quickjs.wasm"
  #    digest: "sha256:<sha256sum of quickjs.wasm>"

# --- AOCR mirror (Phase 4) ------------------------------------------------
# Empty host disables mirror rewriting entirely. Upstreams maps upstream
# hostnames to repository prefixes inside the mirror.
#
# push_host is the AOCR write vhost. It is required for snapshot distribution
# (snapshot_push below): snapshots are pushed to
# <push_host>/cluster/<auto_import.cluster_id>/snapshots/<name> so any node can
# pull a sandbox created from a peer's snapshot. Without it a snapshot stays a
# local-only commit and a derived sandbox placed on another node fails to pull.
mirror:
  host: "mirror.aocr.aerol.ai"
  push_host: "aocr.aerol.ai"
  upstreams: "docker.io=docker,ghcr.io=ghcr,gcr.io=gcr,quay.io=quay,registry.k8s.io=k8s"
  # Background push of sandbox snapshots (and firecracker templates) to AOCR so
  # they are reachable cluster-wide. Reuses the auto_import cluster PAT as the
  # registry password and requires auto_import.cluster_id + push_host above.
  snapshot_push_enabled: true
  snapshot_push_reconcile_interval: "5m"
  snapshot_push_max_in_flight: 2
  # Optional AOCR retention suffix appended to pushed snapshot tags
  # (latest<suffix>), e.g. "--ttl-7d" or "--idle-30d". Empty keeps a plain
  # latest tag the reaper never expires — the right posture for durable
  # failover snapshots in prod. Ephemeral clusters set a short TTL so their
  # snapshots auto-reap (the integration overlay sets "--ttl-1h").
  snapshot_push_tag_suffix: ""

# --- AOCR auto-import (Phase 4) -------------------------------------------
# enabled=true requires hooks_url + cluster_id + a cluster PAT (delivered as
# a secret separately — see header). Sandboxd refuses to boot otherwise.
auto_import:
  enabled: true
  hooks_url: "https://aocr.aerol.ai"
  cluster_id: "prod-aerolvm-us-east-1"
  retention_suffix: "--idle-7d"
  request_timeout: "15s"
  reconcile_interval: "5m"
  max_in_flight: 4

# --- Fleet control plane --------------------------------------------------
# Optional managed integration: caller-token validation, fleet usage
# telemetry, and standing-driven quota enforcement. Off by default — the
# open-source daemon then accepts only the operator PAT and reports nothing.
#
# Deliberately minimal: only the endpoint and a refresh cadence live here.
# Every operational tunable (account-key field, cache/poll cadences,
# thresholds and their grace windows, webhook target, delivery sink, the
# create-gating policy) is pulled at runtime from the managed contract API, so
# policy changes never require editing this file or redeploying. The fleet
# token is a secret delivered via config/secrets.yml (see header), not here.
fleet_control_plane:
  enabled: false
  endpoint: ""
  contract_refresh: "5m"
